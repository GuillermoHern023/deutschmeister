<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeutschMeister — A1 bis B1 Alltag & Goethe-Zertifikat</title>
<meta name="description" content="Complete German A1, A2.1, A2.2 & B1 Academy for Real-World Conversation in Germany and Official Goethe-Zertifikat Exam Training.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================
   DEUTSCHMEISTER • FRIENDLY PASTEL DESIGN SYSTEM
   Warm, Cheerful, Tactile & Accessible
   ============================================ */

:root {
  /* Warm, Friendly Pastel Canvas & Card Surfaces (Default Light) */
  --bg-canvas: #faf8f5;
  --bg-surface: #ffffff;
  --bg-surface-elevated: #f4f6fa;
  --bg-surface-card: #ffffff;
  --bg-card: #ffffff;
  --bg-card-hover: #f1f5f9;
  
  --border-subtle: #e8ecf4;
  --border-medium: #cbd5e1;
  --border-focus: #38bdf8;
  
  /* Highly Readable, Warm Slate Typography (WCAG AAA/AA 4.5:1+) */
  --text-primary: #1e293b;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  
  /* Friendly Pastel Accent Tokens */
  /* 1. Pastel Sky (Der / Primary Action / Runner Focus) */
  --pastel-sky: #38bdf8;
  --pastel-sky-hover: #0ea5e9;
  --pastel-sky-bg: #e0f2fe;
  --pastel-sky-border: #bae6fd;
  --pastel-sky-shadow: #0284c7;
  --pastel-sky-text: #0369a1;

  /* 2. Pastel Mint (Das / Success / Level Progression) */
  --pastel-mint: #34d399;
  --pastel-mint-hover: #10b981;
  --pastel-mint-bg: #dcfce7;
  --pastel-mint-border: #86efac;
  --pastel-mint-shadow: #059669;
  --pastel-mint-text: #15803d;

  /* 3. Pastel Butter / Amber (Streak / XP / Golden Stars) */
  --pastel-amber: #fbbf24;
  --pastel-amber-hover: #f59e0b;
  --pastel-amber-bg: #fef3c7;
  --pastel-amber-border: #fde68a;
  --pastel-amber-shadow: #d97706;
  --pastel-amber-text: #b45309;

  /* 4. Pastel Strawberry / Coral (Die / Spanish Tips / Alerts) */
  --pastel-coral: #fb7185;
  --pastel-coral-hover: #f43f5e;
  --pastel-coral-bg: #ffe4e6;
  --pastel-coral-border: #fecdd3;
  --pastel-coral-shadow: #e11d48;
  --pastel-coral-text: #be123c;

  /* 5. Pastel Lilac / Lavender (Sentence Builder / Milestones) */
  --pastel-lavender: #c084fc;
  --pastel-lavender-hover: #a855f7;
  --pastel-lavender-bg: #f3e8ff;
  --pastel-lavender-border: #e9d5ff;
  --pastel-lavender-shadow: #9333ea;
  --pastel-lavender-text: #7e22ce;

  /* Legacy Brand Variables mapped to pastel tokens for 100% compatibility */
  --brand-blue: var(--pastel-sky);
  --brand-blue-hover: var(--pastel-sky-hover);
  --brand-blue-dark: var(--pastel-sky-shadow);
  --brand-blue-glow: rgba(56, 189, 248, 0.35);

  --brand-green: var(--pastel-mint);
  --brand-green-hover: var(--pastel-mint-hover);
  --brand-green-glow: rgba(52, 211, 153, 0.35);

  --brand-amber: var(--pastel-amber);
  --brand-amber-light: var(--pastel-amber-border);
  --brand-amber-glow: rgba(251, 191, 36, 0.35);

  --brand-red: var(--pastel-coral);
  --brand-red-glow: rgba(251, 113, 133, 0.35);

  --brand-purple: var(--pastel-lavender);
  --brand-purple-glow: rgba(192, 132, 252, 0.35);

  /* Typography */
  --font-main: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  
  /* Friendly Rounded Radii */
  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 26px;
  --radius-full: 9999px;
  
  /* Soft Ambient Lighting & Depth */
  --shadow-sm: 0 2px 6px rgba(100, 116, 139, 0.08);
  --shadow-md: 0 8px 24px rgba(100, 116, 139, 0.12);
  --shadow-lg: 0 16px 36px rgba(100, 116, 139, 0.14);
  --shadow-glow-blue: 0 0 20px var(--brand-blue-glow);
  --shadow-glow-green: 0 0 20px var(--brand-green-glow);
  --shadow-glow-amber: 0 0 20px var(--brand-amber-glow);
  
  /* Cheerful Bouncy Transitions */
  --transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  --transition-smooth: all 0.25s ease;
}

/* Pastel Night Theme Option */
[data-theme="dark"] {
  --bg-canvas: #0f172a;
  --bg-surface: #1e293b;
  --bg-surface-elevated: #28354f;
  --bg-surface-card: #1e293b;
  --bg-card: #1e293b;
  --bg-card-hover: #334155;

  --border-subtle: rgba(255, 255, 255, 0.1);
  --border-medium: rgba(255, 255, 255, 0.18);
  --border-focus: #38bdf8;

  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #94a3b8;

  --pastel-sky-bg: rgba(56, 189, 248, 0.18);
  --pastel-sky-border: rgba(56, 189, 248, 0.35);
  --pastel-sky-text: #7dd3fc;

  --pastel-mint-bg: rgba(52, 211, 153, 0.18);
  --pastel-mint-border: rgba(52, 211, 153, 0.35);
  --pastel-mint-text: #6ee7b7;

  --pastel-amber-bg: rgba(251, 191, 36, 0.18);
  --pastel-amber-border: rgba(251, 191, 36, 0.35);
  --pastel-amber-text: #fde047;

  --pastel-coral-bg: rgba(251, 113, 133, 0.18);
  --pastel-coral-border: rgba(251, 113, 133, 0.35);
  --pastel-coral-text: #fda4af;

  --pastel-lavender-bg: rgba(192, 132, 252, 0.18);
  --pastel-lavender-border: rgba(192, 132, 252, 0.35);
  --pastel-lavender-text: #d8b4fe;

  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 16px 36px rgba(0, 0, 0, 0.5);
}

/* Global Reset & Base Typography */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-family: var(--font-main);
  background-color: var(--bg-canvas);
  color: var(--text-primary);
  font-size: 15px;
  scroll-behavior: smooth;
  transition: background-color 0.3s ease, color 0.3s ease;
}

body {
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* App Shell */
#app {
  display: flex;
  width: 100%;
  min-height: 100vh;
}

/* ============================================
   SIDEBAR
   ============================================ */
.sidebar {
  width: 290px;
  background-color: var(--bg-surface);
  border-right: 2px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 100;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
  box-shadow: 2px 0 16px rgba(100, 116, 139, 0.05);
}
.sidebar::-webkit-scrollbar { width: 5px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 4px; }

.sidebar-header {
  padding: 24px 22px 18px;
  border-bottom: 2px solid var(--border-subtle);
}
.sidebar-header h1 {
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 10px;
}
.sidebar-header h1 span {
  background: linear-gradient(135deg, #0ea5e9, #6366f1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.sidebar-header .subtitle {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-top: 4px;
}

/* XP Bar & Daily Stats */
.xp-bar-container {
  padding: 16px 20px;
  border-bottom: 2px solid var(--border-subtle);
  background: var(--bg-surface-elevated);
  margin: 12px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
}
.xp-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.xp-bar {
  height: 10px;
  background: var(--border-medium);
  border-radius: var(--radius-full);
  overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.06);
}
.xp-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--pastel-amber), #fbbf24);
  border-radius: var(--radius-full);
  transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
}
.level-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--pastel-amber-text);
  background: var(--pastel-amber-bg);
  padding: 4px 10px;
  border-radius: var(--radius-full);
  border: 1px solid var(--pastel-amber-border);
}
.streak-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.78rem;
  font-weight: 800;
  color: #ea580c;
  background: #fff7ed;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  border: 1px solid #fed7aa;
}

/* 15-Minute Study Timer Card in Sidebar */
.sidebar-timer-card {
  background: var(--bg-surface);
  border: 2px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  cursor: pointer;
  transition: var(--transition);
  width: 100%;
  margin-top: 12px;
  box-shadow: 0 3px 0 var(--border-medium);
}
.sidebar-timer-card:hover {
  border-color: var(--pastel-sky);
  transform: translateY(-2px);
  box-shadow: 0 5px 0 var(--pastel-sky-border);
}
.sidebar-timer-card:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--border-medium);
}
.sidebar-timer-card.running {
  border-color: var(--pastel-mint);
  background: var(--pastel-mint-bg);
  box-shadow: 0 3px 0 var(--pastel-mint-border);
}
.timer-status-badge {
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  background: var(--bg-surface-elevated);
  color: var(--text-secondary);
  border: 1px solid var(--border-medium);
  transition: var(--transition);
}
.sidebar-timer-card.running .timer-status-badge {
  background: var(--pastel-mint-border);
  color: var(--pastel-mint-text);
  border-color: var(--pastel-mint);
}

/* Level Tabs */
.level-tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--bg-surface-elevated);
  margin: 6px 14px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
}
.level-tab-btn {
  flex: 1;
  padding: 8px 4px;
  border-radius: var(--radius-xs);
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  text-align: center;
}
.level-tab-btn:hover { color: var(--text-primary); }
.level-tab-btn.active {
  background: var(--pastel-sky);
  color: #fff;
  font-weight: 800;
  box-shadow: 0 3px 0 var(--pastel-sky-shadow), 0 4px 10px rgba(14, 165, 233, 0.25);
}

/* Sidebar Options & Controls */
.sidebar-options {
  padding: 4px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-secondary);
}
.toggle-pill {
  padding: 6px 14px;
  border-radius: var(--radius-full);
  border: 1.5px solid var(--border-medium);
  background: var(--bg-surface);
  color: var(--text-primary);
  font-size: 0.74rem;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 2px 0 var(--border-medium);
}
.toggle-pill:hover {
  background: var(--bg-surface-elevated);
  border-color: var(--pastel-sky);
  transform: translateY(-1px);
  box-shadow: 0 3px 0 var(--border-medium);
}
.toggle-pill:active {
  transform: translateY(1px);
  box-shadow: 0 1px 0 var(--border-medium);
}

/* Chapter Navigation Items in Sidebar */
.chapter-nav-item {
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.85rem;
  color: var(--text-secondary);
  transition: var(--transition);
  margin-bottom: 4px;
  border: 1px solid transparent;
}
.chapter-nav-item:hover {
  background: var(--bg-surface-elevated);
  color: var(--text-primary);
  border-color: var(--border-subtle);
  transform: translateX(3px);
}
.chapter-nav-item.active {
  background: var(--pastel-sky-bg);
  color: var(--pastel-sky-text);
  font-weight: 700;
  border-color: var(--pastel-sky-border);
}

/* ============================================
   MAIN CONTENT AREA
   ============================================ */
.main-content {
  margin-left: 290px;
  flex: 1;
  padding: 40px 36px 120px;
  min-height: 100vh;
  position: relative;
  max-width: 960px;
  margin-right: auto;
}

/* Top Sticky Navigation Pill on Main Content */
.timeline-top-nav {
  position: sticky;
  top: 16px;
  z-index: 80;
  background: var(--bg-surface);
  border: 2px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 18px 24px;
  margin-bottom: 30px;
  box-shadow: 0 8px 24px rgba(100, 116, 139, 0.08);
  backdrop-filter: blur(12px);
}
.course-identity {
  display: flex;
  align-items: center;
  gap: 14px;
}
.flag-avatar {
  font-size: 2.2rem;
  line-height: 1;
}
.course-name {
  font-size: 1.18rem;
  font-weight: 800;
  color: var(--text-primary);
}
.course-sub {
  font-size: 0.82rem;
  color: var(--text-secondary);
}

.top-stats-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius-full);
  font-size: 0.82rem;
  font-weight: 800;
  border: 1.5px solid var(--border-subtle);
  background: var(--bg-surface-elevated);
  box-shadow: 0 2px 0 var(--border-medium);
}
.stat-pill.streak {
  background: #fff7ed;
  border-color: #fed7aa;
  color: #ea580c;
  box-shadow: 0 2px 0 #fdba74;
}
.stat-pill.xp {
  background: var(--pastel-amber-bg);
  border-color: var(--pastel-amber-border);
  color: var(--pastel-amber-text);
  box-shadow: 0 2px 0 #fcd34d;
}
.stat-pill.level {
  background: var(--pastel-mint-bg);
  border-color: var(--pastel-mint-border);
  color: var(--pastel-mint-text);
  box-shadow: 0 2px 0 #86efac;
}

/* 15-Minute Timer Pill */
.stat-pill.timer-pill {
  background: var(--pastel-amber-bg);
  border-color: var(--pastel-amber-border);
  color: var(--pastel-amber-text);
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 3px 0 #fcd34d;
}
.stat-pill.timer-pill:hover {
  background: #fef08a;
  transform: translateY(-2px);
  box-shadow: 0 4px 0 #fcd34d;
}
.stat-pill.timer-pill:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #fcd34d;
}
.stat-pill.timer-pill.running {
  background: var(--pastel-mint-bg);
  border-color: var(--pastel-mint);
  color: var(--pastel-mint-text);
  box-shadow: 0 3px 0 var(--pastel-mint-shadow);
  animation: timerPulse 2s infinite ease-in-out;
}
@keyframes timerPulse {
  0%, 100% { box-shadow: 0 3px 0 var(--pastel-mint-shadow), 0 0 6px rgba(52, 211, 153, 0.25); }
  50% { box-shadow: 0 3px 0 var(--pastel-mint-shadow), 0 0 16px rgba(52, 211, 153, 0.45); }
}

.sound-toggle-btn {
  background: var(--bg-surface);
  border: 2px solid var(--border-medium);
  border-radius: var(--radius-full);
  padding: 6px 12px;
  cursor: pointer;
  font-size: 0.95rem;
  transition: var(--transition);
  box-shadow: 0 2px 0 var(--border-medium);
}
.sound-toggle-btn:hover {
  transform: scale(1.05);
}

/* Hero Next Lesson Card */
.hero-next-card {
  background: linear-gradient(135deg, #e0f2fe 0%, #ecfdf5 100%);
  border: 2px solid #bae6fd;
  border-radius: var(--radius-lg);
  padding: 26px 30px;
  margin-bottom: 38px;
  box-shadow: 0 10px 24px rgba(56, 189, 248, 0.12);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
}
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #ffffff;
  color: #0284c7;
  border: 1.5px solid #bae6fd;
  font-size: 0.74rem;
  font-weight: 800;
  padding: 4px 14px;
  border-radius: var(--radius-full);
  margin-bottom: 10px;
  letter-spacing: 0.05em;
  box-shadow: 0 2px 6px rgba(14, 165, 233, 0.12);
}
.hero-title {
  font-size: 1.45rem;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.hero-desc {
  font-size: 0.92rem;
  color: var(--text-secondary);
}

/* ============================================
   BUSUU TIMELINE (STEPPING-STONE LEARNING PATH)
   ============================================ */
.busuu-timeline {
  max-width: 680px;
  margin: 0 auto;
  position: relative;
}

/* Chapter Card Banner */
.timeline-chapter {
  margin-bottom: 70px;
  position: relative;
}
.chapter-banner {
  background: var(--bg-surface);
  border: 2px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 26px 30px;
  margin-bottom: 40px;
  box-shadow: 0 10px 28px rgba(100, 116, 139, 0.08);
  position: relative;
  overflow: hidden;
}
.chapter-banner::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 6px;
  height: 100%;
  background: linear-gradient(180deg, var(--pastel-sky), var(--pastel-mint));
  border-radius: 6px 0 0 6px;
}
.chapter-badge {
  display: inline-block;
  font-size: 0.74rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--pastel-sky-dark);
  background: var(--pastel-sky-bg);
  padding: 3px 10px;
  border-radius: var(--radius-full);
  margin-bottom: 8px;
}
.chapter-title {
  font-size: 1.45rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--text-primary);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.chapter-desc {
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 16px;
}
.chapter-progress-box {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-secondary);
}
.chapter-progress-bar {
  flex: 1;
  height: 10px;
  background: var(--border-subtle);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.chapter-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--pastel-sky), var(--pastel-mint));
  border-radius: var(--radius-full);
  transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Stepping-Stone Track */
.path-track {
  position: relative;
  padding: 20px 0 40px;
}
.path-track::before {
  content: '';
  position: absolute;
  top: 40px;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  border-left: 3px dashed var(--border-medium);
  z-index: 1;
}

/* Stepping Stone Row */
.stone-row {
  display: flex;
  justify-content: center;
  margin-bottom: 48px;
  position: relative;
  z-index: 2;
  transition: transform 0.3s ease;
}
.stone-row.stagger-center { transform: translateX(0); }
.stone-row.stagger-left   { transform: translateX(-80px); }
.stone-row.stagger-right  { transform: translateX(80px); }

.stone-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  position: relative;
  transition: var(--transition);
}
.stone-container:hover {
  transform: translateY(-4px);
}

/* Tactile 3D Circular Stone Button */
.stone-circle {
  width: 82px;
  height: 82px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.9rem;
  position: relative;
  transition: var(--transition);
  user-select: none;
}

/* States with Tactile 3D Depths (Busuu & Duolingo style) */
.stone-circle.completed {
  background: linear-gradient(145deg, #4ade80 0%, #22c55e 100%);
  border: 3px solid #bbf7d0;
  box-shadow: 0 8px 0 #15803d, 0 12px 24px rgba(34, 197, 94, 0.25);
  color: #fff;
}
.stone-circle.completed:active {
  transform: translateY(6px);
  box-shadow: 0 2px 0 #15803d, 0 4px 10px rgba(34, 197, 94, 0.2);
}

.stone-circle.active {
  width: 90px;
  height: 90px;
  background: linear-gradient(145deg, #38bdf8 0%, #0ea5e9 100%);
  border: 3.5px solid #bae6fd;
  box-shadow: 0 9px 0 #0284c7, 0 15px 30px rgba(14, 165, 233, 0.3);
  color: #fff;
}
.stone-circle.active:active {
  transform: translateY(7px);
  box-shadow: 0 2px 0 #0284c7, 0 6px 14px rgba(14, 165, 233, 0.2);
}

.stone-circle.unlocked {
  background: var(--bg-surface);
  border: 3px solid var(--border-medium);
  box-shadow: 0 6px 0 var(--border-medium);
  color: var(--text-primary);
}
.stone-circle.unlocked:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 var(--border-medium);
}

.stone-circle.locked {
  background: var(--bg-surface-elevated);
  border: 2px solid var(--border-subtle);
  box-shadow: 0 6px 0 var(--border-medium);
  color: var(--text-muted);
  opacity: 0.75;
}

/* Milestone Checkpoint Crown */
.stone-circle.checkpoint.completed {
  background: linear-gradient(145deg, #fbbf24 0%, #f59e0b 100%);
  border: 3.5px solid #fde68a;
  box-shadow: 0 9px 0 #b45309, 0 14px 28px rgba(245, 158, 11, 0.3);
}

/* Pulsing Halo on Active Stone */
@keyframes pulse-ring {
  0% { transform: scale(0.96); opacity: 0.85; }
  50% { transform: scale(1.25); opacity: 0; }
  100% { transform: scale(0.96); opacity: 0; }
}
.stone-circle.active::before {
  content: '';
  position: absolute;
  top: -12px;
  left: -12px;
  right: -12px;
  bottom: -12px;
  border-radius: var(--radius-full);
  border: 3px solid var(--pastel-sky);
  animation: pulse-ring 2.2s infinite cubic-bezier(0.4, 0, 0.6, 1);
  pointer-events: none;
}

/* "START HIER" Floating Badge */
.start-here-beacon {
  position: absolute;
  top: -38px;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #fff;
  font-size: 0.74rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
  white-space: nowrap;
  animation: bounce-gentle 1.8s infinite ease-in-out;
  pointer-events: none;
  z-index: 10;
}
.start-here-beacon::after {
  content: '';
  position: absolute;
  bottom: -5px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 5px 5px 0;
  border-style: solid;
  border-color: #d97706 transparent transparent;
}
@keyframes bounce-gentle {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* Stone Sub-Labels & Stars */
.stone-title-label {
  margin-top: 10px;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-secondary);
  max-width: 140px;
  text-align: center;
  line-height: 1.3;
}
.stone-stars {
  display: flex;
  gap: 2px;
  margin-top: 4px;
  font-size: 0.78rem;
}

/* Hover Preview Card on Stepping Stones */
.stone-card-preview {
  position: absolute;
  bottom: 105px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  width: 250px;
  background: var(--bg-surface);
  border: 2px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: 0 14px 30px rgba(100, 116, 139, 0.16);
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 100;
  text-align: center;
}
.stone-container:hover .stone-card-preview {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ============================================
   LESSON RUNNER (BUSUU FULL-SCREEN FOCUS FLOW)
   ============================================ */
.busuu-runner {
  max-width: 720px;
  margin: 0 auto;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Runner Top Bar */
.runner-topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 0 28px;
}
.btn-runner-close {
  width: 42px;
  height: 42px;
  border-radius: var(--radius-full);
  background: var(--bg-surface);
  border: 2px solid var(--border-medium);
  color: var(--text-secondary);
  font-size: 1.15rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 2px 0 var(--border-medium);
}
.btn-runner-close:hover {
  background: #fee2e2;
  color: #ef4444;
  border-color: #fca5a5;
  transform: scale(1.05);
}

.runner-progress-container {
  flex: 1;
  height: 14px;
  background: var(--border-subtle);
  border-radius: var(--radius-full);
  overflow: hidden;
  position: relative;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
}
.runner-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #38bdf8, #34d399);
  border-radius: var(--radius-full);
  transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 0 10px rgba(52, 211, 153, 0.4);
}

.runner-timer-pill {
  background: var(--pastel-amber-bg);
  border: 1.5px solid var(--pastel-amber-border);
  color: var(--pastel-amber-text);
  border-radius: var(--radius-full);
  padding: 6px 14px;
  font-size: 0.82rem;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: var(--transition);
  box-shadow: 0 2px 0 var(--pastel-amber-border);
}
.runner-timer-pill:hover {
  background: #fef08a;
}
.runner-timer-pill.running {
  background: var(--pastel-mint-bg);
  border-color: var(--pastel-mint);
  color: var(--pastel-mint-text);
  box-shadow: 0 2px 0 var(--pastel-mint-border);
}

.runner-step-badge {
  font-size: 0.82rem;
  font-weight: 800;
  color: var(--text-secondary);
  white-space: nowrap;
}

.runner-mode-toggle {
  font-size: 0.78rem;
  padding: 7px 14px;
  border-radius: var(--radius-full);
  border: 1.5px solid var(--border-medium);
  background: var(--bg-surface);
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  font-weight: 700;
  box-shadow: 0 2px 0 var(--border-medium);
}
.runner-mode-toggle:hover {
  color: var(--text-primary);
  border-color: var(--pastel-sky);
}

/* Runner Card Body */
.runner-card {
  background: var(--bg-surface);
  border: 2px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 38px 34px;
  box-shadow: 0 16px 36px rgba(100, 116, 139, 0.1);
  min-height: 480px;
  display: flex;
  flex-direction: column;
  position: relative;
  animation: slideInUp 0.3s ease;
}
@keyframes slideInUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Step 1: Vocab Discovery Card */
.vocab-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  flex: 1;
}
.vocab-category-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.76rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 5px 14px;
  border-radius: var(--radius-full);
  background: var(--pastel-sky-bg);
  color: var(--pastel-sky-dark);
  border: 1px solid var(--pastel-sky-border);
  margin-bottom: 22px;
}
.vocab-word-hero {
  font-size: 2.7rem;
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: -0.02em;
  margin-bottom: 12px;
  line-height: 1.2;
}
.vocab-gender-pill {
  display: inline-block;
  font-size: 0.78rem;
  font-weight: 800;
  padding: 4px 14px;
  border-radius: var(--radius-full);
  margin-bottom: 18px;
}
.gender-der { background: #e0f2fe; color: #0284c7; border: 1.5px solid #bae6fd; }
.gender-die { background: #ffe4e6; color: #e11d48; border: 1.5px solid #fecdd3; }
.gender-das { background: #dcfce7; color: #15803d; border: 1.5px solid #86efac; }
.gender-other { background: #f3e8ff; color: #7e22ce; border: 1.5px solid #e9d5ff; }

.audio-hero-btn {
  width: 72px;
  height: 72px;
  border-radius: var(--radius-full);
  background: linear-gradient(145deg, #38bdf8 0%, #0ea5e9 100%);
  border: none;
  color: #fff;
  font-size: 1.85rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 8px 0 #0284c7, 0 14px 28px rgba(14, 165, 233, 0.35);
  transition: var(--transition);
  margin: 10px 0 24px;
}
.audio-hero-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 0 #0284c7, 0 16px 32px rgba(14, 165, 233, 0.4);
}
.audio-hero-btn:active {
  transform: translateY(6px);
  box-shadow: 0 2px 0 #0284c7, 0 6px 14px rgba(14, 165, 233, 0.25);
}

.vocab-meaning {
  font-size: 1.4rem;
  color: var(--text-secondary);
  margin-bottom: 24px;
  font-weight: 600;
}

/* Spanish Helper Callout Box (For Guillermo) */
.spanish-helper-box {
  background: #fffbeb;
  border: 1.5px solid #fde68a;
  border-radius: var(--radius-md);
  padding: 16px 20px;
  margin-bottom: 24px;
  text-align: left;
  width: 100%;
  box-shadow: 0 2px 8px rgba(245, 158, 11, 0.08);
}
.spanish-helper-header {
  font-size: 0.82rem;
  font-weight: 800;
  color: #b45309;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.spanish-helper-text {
  font-size: 0.9rem;
  color: #78350f;
  line-height: 1.5;
}

/* Real-world Berlin Example Box */
.berlin-example-box {
  background: #f0fdf4;
  border: 1.5px solid #bbf7d0;
  border-radius: var(--radius-md);
  padding: 16px 20px;
  text-align: left;
  width: 100%;
  margin-bottom: 28px;
  box-shadow: 0 2px 8px rgba(34, 197, 94, 0.06);
}
.berlin-example-label {
  font-size: 0.76rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #15803d;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.berlin-example-de {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.berlin-example-en {
  font-size: 0.88rem;
  color: var(--text-secondary);
}

/* Step 2: Instant Recall Drill */
.micro-drill-stage {
  display: flex;
  flex-direction: column;
  flex: 1;
}
.drill-instruction {
  font-size: 0.84rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--pastel-sky-dark);
  margin-bottom: 12px;
}
.drill-question-box {
  background: var(--bg-surface-elevated);
  border: 2px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 24px;
  text-align: center;
  margin-bottom: 24px;
}
.drill-question-text {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--text-primary);
}
.drill-options-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-bottom: 24px;
}
.drill-option-btn {
  background: var(--bg-surface);
  border: 2px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 16px 22px;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-primary);
  cursor: pointer;
  transition: var(--transition);
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 4px 0 var(--border-medium);
}
.drill-option-btn:hover {
  background: #f8fafc;
  border-color: var(--pastel-sky);
  transform: translateY(-2px);
  box-shadow: 0 6px 0 var(--pastel-sky-border);
}
.drill-option-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--border-medium);
}
.drill-option-btn.selected-correct {
  background: #dcfce7;
  border-color: #4ade80;
  color: #15803d;
  box-shadow: 0 4px 0 #22c55e;
}
.drill-option-btn.selected-wrong {
  background: #ffe4e6;
  border-color: #fb7185;
  color: #be123c;
  box-shadow: 0 4px 0 #f43f5e;
}

/* Bottom Sheet Feedback for Drills */
.runner-feedback-sheet {
  border-radius: var(--radius-md);
  padding: 18px 24px;
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  animation: slideInUp 0.25s ease;
  box-shadow: 0 4px 14px rgba(100, 116, 139, 0.08);
}
.runner-feedback-sheet.correct {
  background: #dcfce7;
  border: 2px solid #86efac;
}
.runner-feedback-sheet.wrong {
  background: #ffe4e6;
  border: 2px solid #fecdd3;
}
.feedback-text-title {
  font-size: 1.15rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
}
.runner-feedback-sheet.correct .feedback-text-title { color: #15803d; }
.runner-feedback-sheet.wrong .feedback-text-title { color: #be123c; }
.feedback-text-desc {
  font-size: 0.88rem;
  color: var(--text-secondary);
  margin-top: 4px;
  font-weight: 500;
}

/* Step 2b: Fill-in-the-Blank (Lückentext) */
.fill-blank-stage {
  display: flex;
  flex-direction: column;
  flex: 1;
}
.fill-blank-sentence-card {
  background: var(--bg-surface-elevated);
  border: 2px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 26px 22px;
  text-align: center;
  margin-bottom: 22px;
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.6;
}
.blank-placeholder {
  display: inline-block;
  min-width: 90px;
  border-bottom: 3.5px solid var(--pastel-sky);
  color: var(--pastel-sky-dark);
  font-weight: 800;
  padding: 0 8px;
}
.fill-blank-hint {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--pastel-amber-text);
  background: var(--pastel-amber-bg);
  border: 1px solid var(--pastel-amber-border);
  border-radius: var(--radius-full);
  padding: 4px 14px;
  margin-top: 14px;
}
.fill-blank-input-group {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}
.fill-blank-input {
  flex: 1;
  background: var(--bg-surface);
  border: 2px solid var(--border-medium);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-primary);
  transition: var(--transition);
}
.fill-blank-input:focus {
  outline: none;
  border-color: var(--pastel-sky);
  box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2);
}
.fill-blank-input.correct {
  border-color: var(--pastel-mint);
  background: var(--pastel-mint-bg);
  color: var(--pastel-mint-text);
}
.fill-blank-input.wrong {
  border-color: var(--pastel-coral);
  background: var(--pastel-coral-bg);
  color: var(--pastel-coral-text);
}

/* Step 3: Busuu Grammar Snapshot */
.grammar-snapshot-stage {
  display: flex;
  flex-direction: column;
  flex: 1;
}
.grammar-hero-card {
  background: var(--bg-surface-elevated);
  border: 2px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 24px;
  margin-bottom: 20px;
}
.grammar-rule-summary {
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 16px;
  line-height: 1.5;
}

/* Step 4: Dialogue in Action (WhatsApp / iMessage Style) */
.dialogue-stage {
  display: flex;
  flex-direction: column;
  flex: 1;
}
.dialogue-chat-box {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 24px;
}
.chat-msg-row {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.chat-msg-row.right {
  flex-direction: row-reverse;
}
.chat-avatar {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-full);
  background: var(--bg-surface-elevated);
  border: 1.5px solid var(--border-medium);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
}
.chat-bubble {
  max-width: 75%;
  padding: 14px 18px;
  border-radius: 20px;
  position: relative;
  box-shadow: 0 2px 8px rgba(100, 116, 139, 0.08);
}
.chat-msg-row.left .chat-bubble {
  background: #f8fafc;
  border: 1.5px solid #e2e8f0;
  border-top-left-radius: 4px;
  color: var(--text-primary);
}
.chat-msg-row.right .chat-bubble {
  background: #e0f2fe;
  border: 1.5px solid #bae6fd;
  border-top-right-radius: 4px;
  color: #0c4a6e;
}
.chat-speaker {
  font-size: 0.74rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}
.chat-msg-row.left .chat-speaker { color: #64748b; }
.chat-msg-row.right .chat-speaker { color: #0284c7; }
.chat-text-de {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.45;
}
.chat-text-en {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-top: 4px;
}
.play-chat-audio-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 1.05rem;
  margin-left: 6px;
  transition: var(--transition);
}
.play-chat-audio-btn:hover { color: var(--pastel-sky); }

/* Step 4b: Word Matching Pairs (Wortpaare verbinden) */
.matching-stage {
  display: flex;
  flex-direction: column;
  flex: 1;
}
.matching-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 24px;
}
.matching-card {
  background: var(--bg-surface);
  border: 2px solid var(--border-medium);
  border-radius: var(--radius-md);
  padding: 16px 14px;
  font-size: 1.02rem;
  font-weight: 700;
  color: var(--text-primary);
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 4px 0 var(--border-medium);
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}
.matching-card:hover {
  background: #f8fafc;
  border-color: var(--pastel-sky);
  transform: translateY(-2px);
  box-shadow: 0 6px 0 var(--pastel-sky-border);
}
.matching-card:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--border-medium);
}
.matching-card.selected {
  border-color: var(--pastel-sky);
  background: var(--pastel-sky-bg);
  color: var(--pastel-sky-dark);
  box-shadow: 0 4px 0 var(--pastel-sky-shadow), 0 0 14px rgba(56, 189, 248, 0.35);
  transform: translateY(-2px);
}
.matching-card.matched {
  border-color: var(--pastel-mint);
  background: var(--pastel-mint-bg);
  color: var(--pastel-mint-text);
  cursor: default;
  pointer-events: none;
  box-shadow: none;
  opacity: 0.95;
}
.matching-card.wrong {
  border-color: var(--pastel-coral);
  background: var(--pastel-coral-bg);
  color: var(--pastel-coral-text);
  animation: matchShake 0.4s ease;
}
@keyframes matchShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* Step 5: Sentence Builder (Word Tiles) */
.tiles-stage {
  display: flex;
  flex-direction: column;
  flex: 1;
}
.tiles-drop-area {
  min-height: 84px;
  background: var(--bg-surface-elevated);
  border: 2.5px dashed var(--border-medium);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 24px;
  transition: var(--transition);
}
.tiles-drop-area.filled {
  border-color: var(--pastel-lavender);

        "sectionTitle": "Reading Passage",
        "type": "reading",
        "content": "<h4>Die Hochzeit — Alex auf Petra und Jens' Hochzeit</h4><p>Es ist Sonntag 11 Uhr. Alex ist noch müde und möchte nicht aufstehen. Aber er lächelt und ist zufrieden. Er hatte gestern einen schönen Tag. Gestern war Alex auf der Hochzeit von Petra und Jens.</p><p>Alex kam um Viertel vor drei an der Kirche an. Aber viele andere Gäste waren schon vor ihm angekommen. Die Kirche war schon fast voll. Zum Glück hatte Louise einen Platz für ihn reserviert.</p><p>Neben Alex und Louise saßen Gwyneth und ihr Freund Max. Sie hatten sich vor sieben Jahren kennengelernt. Auch Tina war in der Kirche, aber allein. Tina und Paul haben sich getrennt.</p><p>Nachdem der Pfarrer viel über Partnerschaft, Liebe und Ehe gesprochen hatte, schaute Alex zu Louise. „Warum weinst du denn, Louise?\" — „Vor Freude! Ich freue mich so für Petra und Jens.\"</p><p>Nach der Kirche fand eine Feier in einem schönen Hotel statt. „Auf das Brautpaar!\", rief Alex. „Auf die Ehe!\", antwortete Jens. „Und auf die Freundschaft!\", fügte Louise hinzu.</p><p>Alex und Louise tanzten lange und lachten viel. „Es ist schon 5 Uhr morgens!\", rief Louise. Dann fuhren die Freunde glücklich und zufrieden nach Hause.</p>"
      },

        "type": "vocabulary",

      {
        "sectionTitle": "Grammar: 'Nachdem' Clauses (Past Perfect + Simple Past)",
        "type": "grammar",
        "content": "<p><strong>Nachdem</strong> (after) is used to connect two events in sequence. The <em>nachdem</em> clause uses the <strong>Plusquamperfekt</strong> (past perfect) and the main clause uses the <strong>Präteritum</strong> or <strong>Perfekt</strong>.</p><h4>Structure:</h4><p><em>Nachdem + Subject + … + Partizip II + hatte/war, Hauptsatz (Präteritum/Perfekt)</em></p><h4>Examples from the text:</h4><ul><li><em><strong>Nachdem</strong> der Pfarrer viel über Liebe und Ehe <strong>gesprochen hatte</strong>, <strong>schaute</strong> Alex zu Louise.</em></li><li><em><strong>Nachdem</strong> alle Gäste einen Sekt zur Begrüßung <strong>getrunken hatten</strong>, <strong>aßen</strong> sie zu Abend.</em></li><li><em><strong>Nachdem</strong> Alex am Samstagmorgen die Einladung <strong>gelesen hatte</strong>, <strong>zog</strong> er seinen Anzug an.</em></li></ul><h4>Useful Phrases for Narrating Sequences:</h4><ul><li><em>zuerst</em> — first</li><li><em>dann</em> — then</li><li><em>nachdem</em> — after</li><li><em>später</em> — later</li></ul>"
      },
      {
        "sectionTitle": "Redewendung (Idiom)",
        "type": "idiom",
        "content": "<p><strong>Auf zwei Hochzeiten tanzen</strong></p><p>Bedeutung: zwei Aufgaben gleichzeitig machen, die man eigentlich nicht parallel machen kann. (To try to do two things at once that can't really be done at the same time.)</p><p><em>Entscheide dich: Möchtest du die Dekoration oder das Essen machen? Du kannst nicht auf zwei Hochzeiten tanzen.</em></p>"
      }

  {
    "id": 15,
    "title": "A Conversation about Culture",
    "titleDe": "Über kulturelle Interessen sprechen",
    "type": "speaking",
    "icon": "🎭",
    "lectureContent": [
      {
        "sectionTitle": "Key Vocabulary — Cultural Interests",
        "type": "vocabulary",
        "content": "<table><thead><tr><th>Deutsch</th><th>English</th><th>Beispiel</th></tr></thead><tbody><tr><td>eine Vorliebe haben für + Akk.</td><td>to have a preference for</td><td>Sie hat eine Vorliebe fürs Theater.</td></tr><tr><td>sich begeistern für + Akk.</td><td>to be enthusiastic about</td><td>Ich begeistere mich für alte Bücher.</td></tr><tr><td>sich interessieren für + Akk.</td><td>to be interested in</td><td>Ich interessiere mich für neue Kulturen.</td></tr><tr><td>etwas empfehlen</td><td>to recommend something</td><td>Ich kann dir dieses Museum empfehlen.</td></tr><tr><td>die Theaterkarte reservieren</td><td>to reserve a theatre ticket</td><td>Sie reserviert ihre Karten lange im Voraus.</td></tr><tr><td>ins Kino gehen</td><td>to go to the cinema</td><td>Er geht jede Woche ins Kino.</td></tr><tr><td>das Reiseziel, -e</td><td>travel destination</td><td>Was denkst du über diese Reiseziele?</td></tr><tr><td>anderswohin</td><td>to somewhere else</td><td>Gehst du gerne ins Theater oder anderswohin?</td></tr><tr><td>gut besucht</td><td>well-attended</td><td>Die Veranstaltung war gut besucht.</td></tr><tr><td>Ich bin überzeugt davon, dass …</td><td>I am convinced that …</td><td>Ich bin überzeugt davon, dass man viele kulturelle Erfahrungen sammeln sollte!</td></tr><tr><td>Ich glaube/denke/finde, dass …</td><td>I believe/think/find that …</td><td>Ich finde, dass virtuelle Museen sehr interessant sind.</td></tr><tr><td>Ich bin dafür/dagegen, dass …</td><td>I am for/against …</td><td>Ich bin dafür, dass wir mehr Museen besuchen.</td></tr></tbody></table>"
      },
      {
        "sectionTitle": "Pronunciation: Ach-Laut and st/sp Rules",
        "type": "grammar",
        "content": "<h3>Der Ach-Laut</h3><p>The <strong>Ach-Laut</strong> occurs when <em>ch</em> follows the vowels <strong>a</strong>, <strong>o</strong>, or <strong>u</strong>. It is a back consonant, produced in the back of the throat.</p><ul><li><strong>machen</strong> → ma<strong>ch</strong>en</li><li><strong>lachen</strong> → la<strong>ch</strong>en</li><li><strong>Nacht</strong> → Na<strong>ch</strong>t</li></ul><h3>Aussprache von st und sp</h3><p>When <strong>st</strong> or <strong>sp</strong> appears at the <em>beginning of a word</em> or at the <em>beginning of a syllable</em>, the <strong>s</strong> is pronounced as <strong>/ʃ/</strong> (like English 'sh'):</p><ul><li><strong>Stadt</strong> → /ʃtatt/</li><li><strong>Ausstellung</strong> → Aus-<strong>/ʃt/</strong>ellung</li><li><strong>sprechen</strong> → <strong>/ʃp/</strong>rechen</li><li><strong>Spaß</strong> → <strong>/ʃp/</strong>aß</li><li><strong>Spanisch</strong> → <strong>/ʃp/</strong>anisch</li></ul><p>When <strong>st</strong> or <strong>sp</strong> appears <em>in the middle or end</em> of a word (or belongs to different word parts), the <strong>s</strong> is pronounced as a normal <strong>/s/</strong>:</p><ul><li><strong>Wespe</strong> → We<strong>/s/</strong>pe</li><li><strong>auspacken</strong> → aus<strong>/s/</strong>packen (compound word: aus + packen)</li><li><strong>gestern</strong> → ge<strong>/s/</strong>tern</li><li><strong>Kunst</strong> → Kun<strong>/s/</strong>t</li></ul>"
      },
      {
        "sectionTitle": "Expressing Opinions",
        "type": "grammar",
        "content": "<p>Use these phrases to express your opinion in a conversation about culture:</p><ul><li><strong>Ich glaube, dass …</strong> — I believe that …</li><li><strong>Ich denke, dass …</strong> — I think that …</li><li><strong>Ich finde, dass …</strong> — I find/feel that …</li><li><strong>Ich bin davon überzeugt, dass …</strong> — I am convinced that …</li><li><strong>Ich bin dafür, dass …</strong> — I am in favour of …</li><li><strong>Ich bin dagegen, dass …</strong> — I am against …</li></ul><p>Remember: after <strong>dass</strong>, the conjugated verb goes to the <em>end</em> of the clause!</p><p><em>Example:</em> Ich finde, dass virtuelle Technologie Museen viel interessanter <strong>macht</strong>.</p>"
      },
      {

nd Ihre Stärken?</td></tr><tr><td>die Schwäche, -n</td><td>weakness</td><td>Was sind Ihre Schwächen?</td></tr></tbody></table>"

        "content": "<p>Read the full story of Tim and Martina:</p><h4>Part 1: Tim's Situation</h4><p>Es ist Montag, 9 Uhr. Alex' Bruder Tim sitzt am Schreibtisch in seinem Büro. Vor ihm liegt ein großer Stapel Papier. Tim ist <strong>Anwalt</strong>. Er ist <strong>selbstständig</strong>, er ist sein eigener Chef. Die Firma gehört ihm. Tims Firma ist in Berlin, aber er wohnt in Potsdam. Also <strong>pendelt</strong> er jeden Tag von Potsdam nach Berlin. Tim hat vier Angestellte in der Firma. Aber das reicht jetzt nicht mehr.</p><h4>Part 2: The Applications</h4><p>Es gibt so viel Arbeit in der Firma. Tim braucht mehr Angestellte. Er braucht einen neuen Sekretär oder eine neue Sekretärin. Der Stapel Papier vor ihm sind <strong>Bewerbungen</strong>. 35 Personen haben sich um die Stelle beworben. Tim muss alle Bewerbungen lesen. Er legt die Bewerbungen auf zwei Stapel: Die Bewerbungen auf dem linken Stapel gefallen ihm. Aber die Bewerbungen auf dem rechten Stapel passen nicht zur Firma. Nur <strong>acht Bewerbungen</strong> liegen auf dem linken Stapel.</p><h4>Part 3: The Interview</h4><p>Das erste Bewerbungsgespräch ist am Mittwoch um 11 Uhr. Die Bewerberin heißt <strong>Martina</strong>. Tims Angestellte führt Martina in den Konferenzraum. Martina setzt sich an den Tisch. Sie ist ein bisschen <strong>nervös</strong>. Tim kommt in den Raum. „Guten Morgen, Frau Zimmermann!\", begrüßt Tim sie.</p><p>Tim fragt Martina viel zu ihren anderen Arbeitsstellen und ihren Aufgaben dort. Die Sekretärin muss schnell <strong>tippen</strong> können, manchmal langweilige Aufgaben erledigen (z. B. Fotokopien machen), und manchmal <strong>Überstunden</strong> machen. Martina ist interessiert an dem Job.</p><h4>Part 4: The Decision</h4><p>Tim entscheidet sich für Martina. Sie passt gut zur Firma. Martina hat zuerst sechs Monate <strong>Probezeit</strong>. Danach wird sie fest angestellt. Sie bekommt <strong>30 Urlaubstage</strong> im Jahr. Und das <strong>Gehalt</strong> ist gut. Martina ist glücklich. Tim ist auch glücklich — endlich bekommt er Unterstützung!</p>"

    "id": 17,
    "title": "Review of Modal Verbs",
    "titleDe": "Wiederholung der Modalverben",
    "type": "grammar",
    "icon": "📝",
    "lectureContent": [
      {
        "sectionTitle": "Die Modalverben: Bedeutung",
        "type": "grammar",
        "content": "<p>German has six modal verbs, each expressing a different shade of meaning:</p><table><thead><tr><th>Modalverb</th><th>Bedeutung</th><th>Beispiel</th></tr></thead><tbody><tr><td><strong>können</strong></td><td>Fähigkeit / Möglichkeit (ability / possibility)</td><td>Ich <em>kann</em> gut singen.</td></tr><tr><td><strong>müssen</strong></td><td>Notwendigkeit / Zwang (necessity / obligation)</td><td>Wir <em>müssen</em> heute arbeiten.</td></tr><tr><td><strong>sollen</strong></td><td>Auftrag / Befehl (task / command)</td><td>Du <em>sollst</em> dein Zimmer aufräumen.</td></tr><tr><td><strong>dürfen</strong></td><td>Erlaubnis (permission)</td><td>Hier <em>darf</em> man parken.</td></tr><tr><td><strong>wollen</strong></td><td>Bedürfnis (want / desire)</td><td>Ich <em>will</em> jetzt schlafen.</td></tr><tr><td><strong>möchte(n)</strong></td><td>Bedürfnis – höflich (polite want)</td><td>Ich <em>möchte</em> ein Eis essen.</td></tr></tbody></table><p><em>möchte(n)</em> funktioniert wie ein Modalverb und ist höflicher als <em>wollen</em>.</p>"
      },
      {
        "sectionTitle": "Die Modalverben im Präsens",
        "type": "grammar",
        "content": "<p>Complete present-tense conjugation of all six modal verbs:</p><table><thead><tr><th>Pronomen</th><th>können</th><th>müssen</th><th>sollen</th><th>dürfen</th><th>wollen</th><th>möchte(n)</th></tr></thead><tbody><tr><td><strong>ich</strong></td><td>kann</td><td>muss</td><td>soll</td><td>darf</td><td>will</td><td>möchte</td></tr><tr><td><strong>du</strong></td><td>kannst</td><td>musst</td><td>sollst</td><td>darfst</td><td>willst</td><td>möchtest</td></tr><tr><td><strong>er/sie/es</strong></td><td>kann</td><td>muss</td><td>soll</td><td>darf</td><td>will</td><td>möchte</td></tr><tr><td><strong>wir</strong></td><td>können</td><td>müssen</td><td>sollen</td><td>dürfen</td><td>wollen</td><td>möchten</td></tr><tr><td><strong>ihr</strong></td><td>könnt</td><td>müsst</td><td>sollt</td><td>dürft</td><td>wollt</td><td>möchtet</td></tr><tr><td><strong>sie/Sie</strong></td><td>können</td><td>müssen</td><td>sollen</td><td>dürfen</td><td>wollen</td><td>möchten</td></tr></tbody></table><p>Notice: <em>ich</em> and <em>er/sie/es</em> always share the same form. The <em>wir</em> and <em>sie/Sie</em> forms are identical to the infinitive.</p>"
      },
      {
        "sectionTitle": "Die Modalverben im Präteritum",
        "type": "grammar",
        "content": "<p>The simple past (Präteritum) of modal verbs is used very frequently in spoken and written German:</p><table><thead><tr><th>Pronomen</th><th>können</th><th>müssen</th><th>sollen</th><th>dürfen</th><th>wollen</th></tr></thead><tbody><tr><td><strong>ich</strong></td><td>konnte</td><td>musste</td><td>sollte</td><td>durfte</td><td>wollte</td></tr><tr><td><strong>du</strong></td><td>konntest</td><td>musstest</td><td>solltest</td><td>durftest</td><td>wolltest</td></tr><tr><td><strong>er/sie/es</strong></td><td>konnte</td><td>musste</td><td>sollte</td><td>durfte</td><td>wollte</td></tr><tr><td><strong>wir</strong></td><td>konnten</td><td>mussten</td><td>sollten</td><td>durften</td><td>wollten</td></tr><tr><td><strong>ihr</strong></td><td>konntet</td><td>musstet</td><td>solltet</td><td>durftet</td><td>wolltet</td></tr><tr><td><strong>sie/Sie</strong></td><td>konnten</td><td>mussten</td><td>sollten</td><td>durften</td><td>wollten</td></tr></tbody></table><p>⚠️ <strong>Wichtig:</strong> Von <em>möchte(n)</em> gibt es kein Präteritum. Im Präteritum und Perfekt wird <em>möchte(n)</em> durch eine Form von <em>wollen</em> ersetzt.</p><p><strong>Beispiel:</strong> <em>Ich möchte ein Stück Erdbeerkuchen essen.</em> → Präteritum: <em>Ich <strong>wollte</strong> ein Stück Erdbeerkuchen essen.</em></p>"
      },
      {
        "sectionTitle": "Modalverben im Perfekt: Der Doppelinfinitiv",
        "type": "grammar",
        "content": "<p>When a modal verb is used with a full verb (Vollverb) in the Perfekt, a special <strong>double infinitive</strong> construction is required. There is <strong>no Partizip II</strong> — instead both verbs appear as infinitives at the end of the sentence.</p><p><strong>Struktur:</strong> <em>haben</em> (konjugiert) + Vollverb (Infinitiv) + Modalverb (Infinitiv)</p><table><thead><tr><th>Präsens</th><th>Perfekt</th></tr></thead><tbody><tr><td>Ich <em>kann</em> gut singen.</td><td>Ich <em>habe</em> gut singen <em>können</em>.</td></tr><tr><td>Nina <em>muss</em> arbeiten.</td><td>Nina <em>hat</em> arbeiten <em>müssen</em>.</td></tr><tr><td>Ich <em>soll</em> mein Zimmer aufräumen.</td><td>Ich <em>habe</em> mein Zimmer aufräumen <em>sollen</em>.</td></tr><tr><td>Anita <em>darf</em> allein zur Schule fahren.</td><td>Anita <em>hat</em> allein zur Schule fahren <em>dürfen</em>.</td></tr><tr><td>Uta <em>will</em> noch nicht schlafen.</td><td>Uta <em>hat</em> noch nicht schlafen <em>wollen</em>.</td></tr><tr><td>Du <em>musst</em> heute arbeiten.</td><td>Du <em>hast</em> heute arbeiten <em>müssen</em>.</td></tr></tbody></table><p>Die Vergangenheitsform von <em>möchte(n)</em> wird mit <em>wollen</em> ersetzt: <em>Ihr möchtet ein neues Auto kaufen.</em> → <em>Ihr habt ein neues Auto kaufen <strong>wollen</strong>.</em></p>"
      },
      {
        "sectionTitle": "Verneinte Modalverben",
        "type": "grammar",
        "content": "<p>To negate a modal verb, place <strong>nicht</strong> after the modal verb:</p><table><thead><tr><th>Positiv</th><th>Negativ</th></tr></thead><tbody><tr><td>Ich <em>will</em> jetzt schlafen.</td><td>Ich <em>will</em> jetzt <strong>nicht</strong> schlafen.</td></tr><tr><td>Hanna <em>kann</em> Auto fahren.</td><td>Hanna <em>kann</em> <strong>nicht</strong> Auto fahren.</td></tr><tr><td>Paul <em>möchte</em> lesen.</td><td>Paul <em>möchte</em> <strong>nicht</strong> lesen.</td></tr><tr><td>Anna <em>soll</em> den Hund füttern.</td><td>Anna <em>soll</em> <strong>nicht</strong> den Hund füttern.</td></tr><tr><td>Hier <em>darf</em> man rauchen.</td><td>Hier <em>darf</em> man <strong>nicht</strong> rauchen.</td></tr><tr><td>Ich <em>muss</em> kochen.</td><td>Ich <em>muss</em> <strong>nicht</strong> kochen.</td></tr></tbody></table><p>Bei den Modalverben ändert sich die Bedeutung bei der Verneinung nicht.</p>"
      },

        "type": "vocabulary",
        "content": "<p>It's important to distinguish between <em>Pläne</em> (plans — concrete intentions) and <em>Wünsche</em> (wishes — desires that may or may not come true).</p><table><thead><tr><th>Pläne 📋</th><th>Wünsche 💭</th></tr></thead><tbody><tr><td>der Plan</td><td>wünschen</td></tr><tr><td>das Ziel</td><td>hoffen</td></tr><tr><td>planen</td><td>der Traum</td></tr><tr><td></td><td>der Wunsch</td></tr><tr><td></td><td>hoffentlich</td></tr></tbody></table><p>Some words like <em>das Ziel</em> and <em>hoffen</em> can fit in both categories depending on context.</p>"

      {
        "sectionTitle": "Infinitivsätze mit zu",
        "type": "grammar",
        "content": "<p>German uses <strong>Infinitivsätze mit <em>zu</em></strong> (infinitive clauses with <em>zu</em>) to express plans, goals, and wishes. Key rules:</p><ul><li>The infinitive clause has <strong>no subject</strong> — it refers to the subject of the main clause.</li><li><em>zu</em> + Infinitiv stand <strong>am Ende</strong> des Infinitivsatzes.</li><li>A comma between the main clause and the infinitive clause is optional but recommended.</li></ul><table><thead><tr><th>Hauptsatz</th><th>Ergänzungen</th><th>zu + Infinitiv</th></tr></thead><tbody><tr><td>Ich habe vor,</td><td>ein neues Haus</td><td>zu bauen.</td></tr><tr><td>Ich habe den Plan,</td><td>mein Studium schnell</td><td>zu beenden.</td></tr><tr><td>Paolo hat das Ziel,</td><td>nächstes Jahr Deutsch</td><td>zu lernen.</td></tr><tr><td>Vera verspricht,</td><td>nicht mehr</td><td>zu lügen.</td></tr></tbody></table>"
      },

        "sectionTitle": "Trennbare Verben im Infinitivsatz",
        "type": "grammar",
        "content": "<p>With <strong>separable verbs</strong> (trennbare Verben), <em>zu</em> is placed <strong>between</strong> the prefix and the verb stem:</p><table><thead><tr><th>Trennbares Verb</th><th>Infinitiv mit zu</th><th>Beispielsatz</th></tr></thead><tbody><tr><td>ab|nehmen</td><td>ab<strong>zu</strong>nehmen</td><td>Ich habe vor, fünf Kilo <strong>abzunehmen</strong>.</td></tr><tr><td>auf|stehen</td><td>auf<strong>zu</strong>stehen</td><td>Jenny hat den Plan, morgen früh <strong>aufzustehen</strong>.</td></tr><tr><td>an|ziehen</td><td>an<strong>zu</strong>ziehen</td><td>Das Kind verspricht, eine dicke Jacke <strong>anzuziehen</strong>.</td></tr><tr><td>um|ziehen</td><td>um<strong>zu</strong>ziehen</td><td>Hattet ihr nicht das Ziel, dieses Jahr <strong>umzuziehen</strong>?</td></tr><tr><td>ein|kaufen</td><td>ein<strong>zu</strong>kaufen</td><td>Ich habe vor, morgen <strong>einzukaufen</strong>.</td></tr></tbody></table><p>⚠️ Non-separable verbs work normally: <em>versprechen → zu versprechen</em>, <em>beenden → zu beenden</em>.</p>"
      },

      {
        "sectionTitle": "Futur I: werden + Infinitiv",
        "type": "grammar",
        "content": "<p>To talk about the future, German uses <strong>Futur I</strong>, formed with <em>werden</em> (conjugated) + Infinitiv at the end of the sentence.</p><table><thead><tr><th>Pronomen</th><th>werden</th><th>Beispiel</th></tr></thead><tbody><tr><td>ich</td><td>werde</td><td>Ich <em>werde</em> viel Geld <em>haben</em>.</td></tr><tr><td>du</td><td>wirst</td><td>Du <em>wirst</em> berühmt <em>werden</em>.</td></tr><tr><td>er/sie/es</td><td>wird</td><td>Er <em>wird</em> nie wieder arbeiten.</td></tr><tr><td>wir</td><td>werden</td><td>Wir <em>werden</em> glücklich <em>sein</em>.</td></tr><tr><td>ihr</td><td>werdet</td><td>Ihr <em>werdet</em> Erfolg <em>haben</em>.</td></tr><tr><td>sie/Sie</td><td>werden</td><td>Sie <em>werden</em> eine Weltreise <em>machen</em>.</td></tr></tbody></table><p>Futur I is used for:</p><ul><li><strong>Vorhersagen</strong> (predictions): <em>Mein Wahrsager sagt, ich werde reich werden.</em></li><li><strong>Vermutungen</strong> (assumptions): <em>Es wird wahrscheinlich regnen.</em></li><li><strong>Pläne und Absichten</strong> (plans): <em>Ich werde nächstes Jahr Deutsch lernen.</em></li></ul>"
      },
      {
        "sectionTitle": "Wenn ..., dann ... (Konditionalsätze)",
        "type": "grammar",
        "content": "<p>The <strong>wenn...dann</strong> construction expresses conditions and their consequences:</p><table><thead><tr><th>Wenn-Satz (Bedingung)</th><th>Dann-Satz (Folge)</th></tr></thead><tbody><tr><td>Wenn ich in der Zukunft viel Geld verdiene,</td><td>dann kaufe ich ein Haus.</td></tr><tr><td>Wenn ich keinen Job finde,</td><td>dann muss ich weiter suchen.</td></tr><tr><td>Wenn ich morgen eine Million Euro gewinne,</td><td>dann reise ich um die Welt.</td></tr><tr><td>Wenn ich Deutsch gelernt habe,</td><td>dann kann ich in Deutschland arbeiten.</td></tr><tr><td>Wenn ich meine Ziele verfolge,</td><td>dann kann ich ein erfolgreiches Leben führen.</td></tr></tbody></table><p>⚠️ Im <em>wenn</em>-Satz steht das konjugierte Verb am <strong>Ende</strong>. Im <em>dann</em>-Satz steht das Verb direkt nach <em>dann</em> (Position 1).</p>"
      },
      {
        "sectionTitle": "Die Aussprache von pf",
        "type": "pronunciation",
        "content": "<p>In German, <strong>pf</strong> is pronounced as a single sound — both the <em>p</em> and <em>f</em> are pronounced together, not separately.</p><table><thead><tr><th>Wort</th><th>Aussprache</th></tr></thead><tbody><tr><td>Apfel</td><td>/ˈap.fl̩/</td></tr><tr><td>Topf</td><td>/tɔpf/</td></tr><tr><td>Pflanze</td><td>/ˈpflan.tsə/</td></tr><tr><td>Pferd</td><td>/pfeːɐ̯t/</td></tr><tr><td>Kopf</td><td>/kɔpf/</td></tr><tr><td>Pfanne</td><td>/ˈpfa.nə/</td></tr><tr><td>kämpfen</td><td>/ˈkɛmp.fn̩/</td></tr><tr><td>pfeifen</td><td>/ˈpfaɪ̯.fn̩/</td></tr><tr><td>hüpfen</td><td>/ˈhʏp.fn̩/</td></tr><tr><td>Knopf</td><td>/knɔpf/</td></tr></tbody></table><p>Tip: Place your lips together (as for <em>p</em>), then release into <em>f</em> without a gap.</p><p><strong>f oder pf?</strong> Übe den Unterschied: fährt, Pferd, Pfadfinder, Abfall, Pflaster, Fehler, Pfeffer, falsch, Apfel.</p>"

se, -n</strong></td><td>world trip</td><td>Sie haben eine Weltreise gemacht.</td></tr></tbody></table>"

        "content": "<p>When talking about past trips, we use various prepositions to describe <strong>where</strong> (local) and <strong>when</strong> (temporal) events took place.</p><h4>Local Prepositions (Lokale Präpositionen):</h4><ul><li><strong>durch + Akkusativ</strong> — <em>eine Tour durch den Regenwald</em></li><li><strong>gegenüber von + Dativ</strong> — <em>gegenüber vom Botanischen Garten</em></li><li><strong>aus + Dativ</strong> — <em>aus einer kleinen Stadt kommen</em></li><li><strong>von + Dativ</strong> — <em>Vom Hotel sind es 2 Minuten zum Strand.</em></li><li><strong>bei + Dativ</strong> — <em>bei einer Gastfamilie / bei Frau Meiers Cousine wohnen</em></li><li><strong>nach + Dativ</strong> — <em>nach Indien / nach Roatan fliegen</em></li><li><strong>zu + Dativ</strong> — <em>zum Arzt gehen</em></li></ul><h4>Temporal Prepositions (Temporale Präpositionen):</h4><ul><li><strong>um + Akkusativ</strong> (exact time) — <em>um 7 Uhr</em></li><li><strong>für + Akkusativ</strong> (duration) — <em>für eine Woche / für 12 Monate</em></li><li><strong>am (an + dem) + Dativ</strong> (days, dates, parts of day) — <em>am Dienstag / am Abend / am 16. Mai</em></li><li><strong>im (in + dem) + Dativ</strong> (months, seasons, future periods) — <em>im Juli / im September</em></li><li><strong>vor + Dativ</strong> (before) — <em>vor einer Woche / vorletztem Jahr</em></li><li><strong>nach + Dativ</strong> (after) — <em>nach der Reise</em></li><li><strong>seit + Dativ</strong> (since) — <em>seit drei Tagen</em></li><li><strong>ab + Dativ</strong> (starting from) — <em>ab nächster Woche</em></li><li><strong>bei + Dativ</strong> (during/concurrently) — <em>beim Frühstück</em></li><li><strong>von ... bis ...</strong> (from ... to ...) — <em>von Januar bis Dezember</em></li></ul>"

        "content": "<table><thead><tr><th>Deutsch</th><th>English</th><th>Beispiel</th></tr></thead><tbody><tr><td><strong>der Check-in, -s</strong></td><td>check-in</td><td>Der Check-in erfolgt an der Rezeption.</td></tr><tr><td><strong>buchen</strong></td><td>to book</td><td>Familie Schmidt möchte ihren Sommerurlaub buchen.</td></tr><tr><td><strong>der Frühbucher-Rabatt, -e</strong></td><td>early bird discount</td><td>Sie buchen im Januar für einen Frühbucher-Rabatt.</td></tr><tr><td><strong>der Ferienort, -e</strong></td><td>holiday resort</td><td>Sie haben sich für einen Ferienort entschieden.</td></tr><tr><td><strong>die Pension, -en</strong></td><td>guesthouse / boarding house</td><td>Herr Schmidt wollte gerne in eine Pension gehen.</td></tr><tr><td><strong>die Übernachtung, -en</strong></td><td>overnight stay</td><td>Sie buchen 14 Übernachtungen.</td></tr><tr><td><strong>die Abreise, -n</strong></td><td>departure</td><td>Die Abreise ist am 3. Oktober.</td></tr><tr><td><strong>die Anreise, -n</strong></td><td>arrival / travel to destination</td><td>Ich hoffe, Sie hatten eine angenehme Anreise.</td></tr><tr><td><strong>sich sonnen</strong></td><td>to sunbathe</td><td>Herr Schmidt sonnt sich gerne am Strand.</td></tr><tr><td><strong>der Sonnenbrand, ⸚e</strong></td><td>sunburn</td><td>Damit er keinen Sonnenbrand bekommt, cremt er sich ein.</td></tr><tr><td><strong>sich eincremen</strong></td><td>to put on sun cream</td><td>Er cremt sich am Strand gut ein.</td></tr><tr><td><strong>der Ausflug, ⸚e</strong></td><td>excursion / trip</td><td>Sie machen einen Ausflug zu einem Badeort.</td></tr><tr><td><strong>die Zeitzone, -n</strong></td><td>time zone</td><td>Die Türkei liegt in einer anderen Zeitzone.</td></tr><tr><td><strong>der Jetlag, -s</strong></td><td>jetlag</td><td>Nach dem Flug in die USA hatte er einen Jetlag.</td></tr><tr><td><strong>der Aufzug, ⸚e</strong></td><td>elevator</td><td>Ihr Zimmer befindet sich neben dem Aufzug.</td></tr><tr><td><strong>die Schlüsselkarte, -n</strong></td><td>key card</td><td>Hier ist Ihre Schlüsselkarte.</td></tr><tr><td><strong>der Schlüssel, -</strong></td><td>key</td><td>Hier ist Ihr Schlüssel.</td></tr><tr><td><strong>der Aufenthalt, -e</strong></td><td>stay</td><td>Wir wünschen einen angenehmen Aufenthalt.</td></tr><tr><td><strong>ausschlafen</strong></td><td>to sleep in</td><td>Im Urlaub lassen meine Kinder mich nicht ausschlafen.</td></tr><tr><td><strong>All-Inclusive-Angebote</strong></td><td>all-inclusive offers</td><td>Viele Deutsche lieben All-Inclusive-Angebote.</td></tr></tbody></table>"

        "sectionTitle": "Grammar: Compound Nouns and Hotel Prepositions",
        "type": "grammar",
        "content": "<p>In German, many words related to travel and hotels are compound nouns. We also practice prepositional phrases used during check-in.</p><h4>Noun Compounds (Nomenkomposita):</h4><p>German compound nouns combine two or more nouns. The gender and plural endings are always determined by the last noun:</p><ul><li>die Zeit + die Zone = <strong>die Zeitzone</strong> (plural: die Zeitzonen)</li><li>der Frühbucher + der Rabatt = <strong>der Frühbucher-Rabatt</strong></li><li>der Sommer + der Urlaub = <strong>der Sommerurlaub</strong></li><li>die Sonne + der Brand = <strong>der Sonnenbrand</strong></li><li>das Mittel + das Meer = <strong>das Mittelmeer</strong></li><li>die Ferien + der Ort = <strong>der Ferienort</strong></li></ul><h4>Common Hotel Prepositions:</h4><ul><li><strong>auf den Namen + Akk</strong> — <em>ein Zimmer auf den Namen Schmidt reserviert</em></li><li><strong>im + Dat</strong> — <em>im 2. Stock / im 1. Stock links vom Aufzug</em></li><li><strong>neben + Dat</strong> — <em>neben dem Aufzug</em></li><li><strong>auf + Akk</strong> (view of) — <em>einen tollen Blick auf den Park gegenüber</em></li></ul>"
      },

      {
        "sectionTitle": "Reading Passage",
        "type": "reading",
        "content": "<h4>Alex und Nils in New York</h4><p>Es ist Freitagabend, 21 Uhr. Alex und Louise sitzen in Louises Wohnzimmer und trinken Rotwein, denn draußen ist es regnerisch. Sie sprechen über ihre bisherigen Urlaube. Alex erzählt Louise von dem Trip mit Nils nach New York, denn das war der beste Urlaub bisher. Nils und Alex haben damals fast den Flug verpasst, denn Nils hat seinen Reisepass vergessen und dann konnte Alex sein Ticket nicht finden. Aber sie hatten Glück und waren gerade noch rechtzeitig am Flughafen. In New York haben die beiden Männer viele Sehenswürdigkeiten besichtigt, zum Beispiel die Freiheitsstatue und das Empire State Building. Vom Empire State Building hatte man eine super Aussicht und konnte die ganze Stadt sehen. Mit dem Hotel hatten die Männer zuerst nicht so viel Glück. Das erste Zimmer war sehr schmutzig. Also haben sie sich beschwert und gefragt, ob sie ein anderes Zimmer bekommen können. Das nächste Zimmer war zwar klein, aber gemütlich und sauber. Alex hofft trotzdem, nächstes Mal einen Urlaub abseits vom Massentourismus machen zu können, denn New York war sehr überfüllt mit Touristen. Alex möchte im nächsten Urlaub mehr Abenteuer erleben.</p><h4>Louise in Tansania</h4><p>Louise erzählt von ihrer Zeit in Tansania, wo sie nach der Schule für sechs Monate bei einer Gastfamilie gewohnt hat. Allein das traditionelle Leben dort war ein Abenteuer für Louise, denn es war ganz anders als ihr Leben in Frankreich. Sie hat mit den Einheimischen gelebt, gekocht und viel Spaß gehabt. Auch wenn die lokalen Bräuche sehr anders waren als in ihrer Heimat, hat Louise die Bräuche respektiert und sie lieben gelernt. Manchmal war das Leben ein bisschen beschwerlich, denn sie war von zu Hause mehr Luxus gewohnt und die Familie, bei der sie gelebt hat, lebte von der Hand in den Mund. Aber sie hat sich ins Ungewisse vorgewagt und so viele Abenteuer erlebt. Zum Beispiel ist sie mit fremden Leuten per Anhalter zum Strand gefahren, ohne Plan, ob sie eine Mitfahrgelegenheit zurück findet. Sie hat viele schöne Erfahrungen in Tansania gemacht. Nach dem Auslandsaufenthalt hatte sie immer Fernweh, denn sie wollte noch mehr entdecken. Deswegen hat sie sich entschlossen, auszuwandern. Wenn auch „nur“ nach Deutschland.</p>"

    "lectureContent": [
      {
        "sectionTitle": "Grammar: Finalsätze (Purpose Clauses)",
        "type": "grammar",
        "content": "<p>Final clauses (Finalsätze) describe a goal, purpose, or intention. They answer the questions <strong>Wozu?</strong> (What for?) or <strong>Zu welchem Zweck?</strong> (For what purpose?).</p><h4>1. Die Subjunktion <em>damit</em>:</h4><ul><li>Connects a main clause and a subordinate clause.</li><li>The conjugated verb in the subordinate clause goes to the <strong>very end</strong>.</li><li>Can be used with any subjects, and <strong>must</strong> be used when the subject of the main clause and the subordinate clause are different.</li><li><em>Ich erzähle meiner Tochter eine Geschichte, damit sie besser schläft.</em> (Subjects: <em>ich</em> ≠ <em>sie</em>)</li></ul><h4>2. Die Subjunktion <em>um... zu</em>:</h4><ul><li>Used <strong>only</strong> when the subject in both clauses is the same. The subject is not repeated in the final clause.</li><li>The verb goes to the end in the infinitive form, preceded by <em>zu</em>.</li><li><em>Marie lernt alles auswendig, um die Prüfung zu bestehen.</em> (Subject: <em>Marie</em> in both clauses)</li></ul><h4>3. Special Rules for <em>um... zu</em>:</h4><ul><li><strong>Separable Verbs</strong>: <em>zu</em> is placed between the prefix and the verb stem.<br/><em>... um in Ruhe auf<strong>zu</strong>wachsen.</em></li><li><strong>Modal & Auxiliary Verbs</strong>: <em>zu</em> is placed directly before the modal/auxiliary verb.<br/><em>... um einen Ausflug machen <strong>zu</strong> können.</em></li></ul><h4>4. Clause Position:</h4><p>The final clause can also be placed first. When this happens, the main clause starts with the conjugated verb.<br/><em>Damit er später Philosophie studieren kann, geht Erik aufs Gymnasium.</em></p>"

        "type": "grammar",
        "content": "<p>In German, plosives are divided into voiced (stimmhaft) and voiceless (stimmlos) sounds:</p><ul><li><strong>b, g, d</strong> are <strong>stimmhaft</strong> (voiced) and pronounced softly.<br/><em>Examples: die Börse, das Bargeld, das Date</em></li><li><strong>p, t, k</strong> are <strong>stimmlos</strong> (voiceless) and pronounced hard.<br/><em>Examples: die Kreditkarte, das Sparkonto, der Reisepass</em></li></ul>"

        "content": "<p>When the voiced plosives <strong>b, d, g</strong> appear at the very end of a word or syllable, they undergo <strong>Auslautverhärtung</strong> (final devoicing) and are pronounced like their voiceless counterparts <strong>p, t, k</strong>:</p><ul><li><strong>b</strong> is pronounced like <strong>p</strong> — e.g., <em>der Urlaub</em></li><li><strong>d</strong> is pronounced like <strong>t</strong> — e.g., <em>das Geld, das Kleid</em></li><li><strong>g</strong> is pronounced like <strong>k</strong> — e.g., <em>der Antrag, der Zug</em></li></ul>"

    "title": "Subjunctive II of modal verbs",

    "lectureContent": [
      {
        "sectionTitle": "Grammatik: Konjunktiv II der Modalverben in der Gegenwart",
        "type": "grammar",
        "content": "<p>Mit dem Konjunktiv II drücken wir Wünsche, irreale Bedingungen, Ratschläge und höfliche Bitten aus. Bei Modalverben bilden wir ihn direkt vom Präteritum-Stamm mit einem Umlaut (außer bei <em>sollen</em> und <em>wollen</em>).</p><h4>Formen der Modalverben im Konjunktiv II (Gegenwart):</h4><table><thead><tr><th>Pronomen</th><th>können</th><th>dürfen</th><th>müssen</th><th>sollen</th><th>wollen</th></tr></thead><tbody><tr><td><strong>ich</strong></td><td>könnte</td><td>dürfte</td><td>müsste</td><td>sollte</td><td>wollte</td></tr><tr><td><strong>du</strong></td><td>könntest</td><td>dürftest</td><td>müsstest</td><td>solltest</td><td>wolltest</td></tr><tr><td><strong>er/sie/es</strong></td><td>könnte</td><td>dürfte</td><td>müsste</td><td>sollte</td><td>wollte</td></tr><tr><td><strong>wir</strong></td><td>könnten</td><td>dürften</td><td>müssten</td><td>sollten</td><td>wollten</td></tr><tr><td><strong>ihr</strong></td><td>könntet</td><td>dürftet</td><td>müsstet</td><td>solltet</td><td>wolltet</td></tr><tr><td><strong>sie/Sie</strong></td><td>könnten</td><td>dürften</td><td>müssten</td><td>sollten</td><td>wollten</td></tr></tbody></table><p><em>Hinweis: <strong>sollen</strong> und <strong>wollen</strong> haben im Konjunktiv II keinen Umlaut!</em></p><p><strong>Satzbau:</strong> Das konjugierte Modalverb steht auf Position 2, der Infinitiv des Vollverbs steht am Satzende.<br/><em>Beispiel: Du <strong>könntest</strong> dich auf einem Jobportal <strong>anmelden</strong>.</em></p>"
      },

        "sectionTitle": "Grammatik: Konjunktiv II der Modalverben in der Vergangenheit",
        "type": "grammar",
        "content": "<p>Für die Vergangenheit benutzen wir die Form <strong>hätte (konjugiert) + Vollverb im Infinitiv + Modalverb im Infinitiv</strong> (Doppelinfinitiv) am Ende des Satzes.</p><ul><li><em>Beispiel: Ich <strong>hätte</strong> gestern <strong>arbeiten müssen</strong>.</em> (Gestern musste ich arbeiten, aber es war ein unerfüllter Wunsch.)</li><li><em>Beispiel: Das <strong>hättest</strong> du nicht <strong>sagen dürfen</strong>!</em> (Du hast es gesagt, aber es war verboten oder unhöflich.)</li></ul><p><strong>Satzbau in der Vergangenheit:</strong> Das konjugierte Verb <em>hätte</em> steht auf Position 2, der Doppelinfinitiv (Vollverb + Modalverb) steht ganz am Ende.</p>"

        "type": "grammar",
        "content": "<p>Das Verb <strong>lassen</strong> ist sehr vielseitig. Es kann sowohl als Vollverb als auch als Hilfsverb verwendet werden.</p><h4>1. Lassen als Vollverb (ohne zweiten Infinitiv):</h4><ul><li><strong>Jemandem etwas geben/überlassen:</strong><br/><em>Beispiel: Ich lasse dir das Buch bis nächste Woche. / Meine Mutter lässt mir ihr Auto.</em></li><li><strong>Mit etwas aufhören:</strong><br/><em>Beispiel: Wann lasst ihr endlich das Rauchen? / Ich lasse das Lernen für heute.</em></li></ul><h4>2. Lassen als Hilfsverb (mit einem zweiten Infinitiv):</h4><ul><li><strong>Etwas erlauben oder verbieten:</strong><br/><em>Beispiel: Der Polizist lässt mich weiterfahren. / Nie lässt du mich aussprechen!</em></li><li><strong>Etwas veranlassen (delegieren):</strong><br/><em>Beispiel: Er lässt sich die Haare schneiden. (Er macht es nicht selbst)</em></li><li><strong>Etwas zurücklassen (nicht verändern):</strong><br/><em>Beispiel: Tom lässt sein Handy liegen. / Ich lasse meine Brille auf der Arbeit liegen.</em></li><li><strong>Vorschlag / Aufforderung:</strong><br/><em>Beispiel: Lasst uns mit der Arbeit beginnen! / Lass uns Deutsch sprechen!</em></li></ul>"
      },
      {
        "sectionTitle": "Grammatik: Sich lassen als Passiversatz",
        "type": "grammar",
        "content": "<p>Die Konstruktion <strong>sich lassen + Infinitiv</strong> wird oft als Ersatz für das Passiv (mit <em>können</em>) benutzt. Sie drückt aus, ob etwas möglich oder unmöglich ist.</p><table><thead><tr><th>Passivsatz</th><th>Ersatz mit \"sich lassen\"</th><th>Bedeutung</th></tr></thead><tbody><tr><td>Der Schrank wird schnell aufgebaut.</td><td>Der Schrank <strong>lässt sich</strong> schnell <strong>aufbauen</strong>.</td><td>Es ist möglich, ihn aufzubauen.</td></tr><tr><td>Das Auto kann nicht repariert werden.</td><td>Das Auto <strong>lässt sich nicht reparieren</strong>.</td><td>Es ist unmöglich, es zu reparieren.</td></tr><tr><td>Ich werde nicht leicht beeinflusst.</td><td>Ich <strong>lasse mich</strong> nicht leicht <strong>beeinflussen</strong>.</td><td>Man kann mich nicht leicht beeinflussen.</td></tr><tr><td>Das kann nicht geplant werden.</td><td>Das <strong>lässt sich</strong> nicht <strong>planen</strong>.</td><td>Es ist unmöglich zu planen.</td></tr></tbody></table>"

        "content": "<h4>3. Das Perfekt von \"lassen\":</h4><ul><li><strong>Als Vollverb:</strong> Konjugiertes <em>haben</em> + <strong>gelassen</strong>.<br/><em>Beispiel: Er hat das Rauchen endlich <strong>gelassen</strong>. / Ich habe den Schlüssel zu Hause <strong>gelassen</strong>.</em></li><li><strong>Als Hilfsverb:</strong> Konjugiertes <em>haben</em> + Infinitiv + <strong>lassen</strong> (Doppelinfinitiv).<br/><em>Beispiel: Ich habe mir helfen <strong>lassen</strong>. / Ich habe meine Haare schneiden <strong>lassen</strong>.</em></li></ul><h4>Redewendungen:</h4><ul><li><strong>fünfe gerade sein lassen</strong>: Fünfe gerade sein lassen bedeutet, mal nicht so streng oder genau zu sein (to turn a blind eye / let things slide).</li><li><strong>sich nicht unterkriegen lassen</strong>: Auch bei Problemen nicht aufgeben, nicht den Mut verlieren (not to let things get you down).</li></ul>"

        "type": "grammar",
        "content": "<p>Das Futur I wird verwendet, um über die Zukunft zu sprechen oder um Vermutungen in der Gegenwart oder Zukunft zu äußern.</p><h4>Bildung des Futur I:</h4><p><strong>konjugierte Form von werden + Infinitiv am Satzende</strong></p><ul><li><em>Beispiel (Fakt über die Zukunft): Ich <strong>werde</strong> am Sonntag ins Wahlbüro <strong>gehen</strong>.</em></li><li><em>Beispiel (Vermutung): Schau mal in den Brief, da <strong>wird</strong> die Adresse bestimmt <strong>drinstehen</strong>.</em></li></ul><h4>Vermeidung des doppelten Verbs \"werden\":</h4><p>Wenn nach <em>werden</em> ein Adjektiv oder Nomen mit dem Verb <em>werden</em> stehen müsste, kann man das zweite <em>werden</em> oft weglassen.</p><ul><li><em>Er wird wieder Kanzler werden. &rarr; Er wird wieder Kanzler.</em></li><li><em>Es wird knapp werden. &rarr; Es wird knapp.</em></li></ul>"

        "type": "grammar",
        "content": "<p>Um eine Vermutung von einem Fakt zu unterscheiden, nutzen wir oft bestimmte Verben oder Modalpartikeln.</p><h4>1. Redeeinleitende Verben:</h4><p>Diese Verben zeigen, dass eine Aussage keine feste Tatsache ist, sondern eine Annahme:</p><ul><li><strong>vermuten</strong>: Ich vermute, das Wahlbüro ist in der Schule.</li><li><strong>schätzen</strong>: Ich schätze, Regina Kunz hat bessere Chancen.</li><li><strong>glauben</strong>: Ich glaube, es wird knapp.</li></ul><h4>2. Modalpartikeln für Vermutungen:</h4><p>Die Partikeln <strong>wohl</strong>, <strong>sicher</strong> und <strong>bestimmt</strong> stehen direkt <strong>hinter dem konjugierten Verb</strong> und kennzeichnen eine Vermutung:</p><ul><li><em>Das Wahlbüro wird <strong>wohl</strong> wieder in der Schule sein.</em></li><li><em>Die Adresse wird <strong>bestimmt</strong> im Brief stehen.</em></li><li><em>Martin Hinz wird <strong>sicher</strong> damit rechnen, wieder Kanzler zu werden.</em></li></ul>"
