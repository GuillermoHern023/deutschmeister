        "type": "vocabulary",
        "content": "<table><thead><tr><th>Deutsch</th><th>English</th><th>Beispiel (Verbstellung!)</th></tr></thead><tbody><tr><td><strong>weil (Verb am Ende)</strong></td><td>because</td><td>Ich lerne Deutsch, weil ich in Berlin wohne.</td></tr><tr><td><strong>da (Verb am Ende)</strong></td><td>since / because (formal)</td><td>Da ich heute viel arbeite, habe ich wenig Zeit.</td></tr><tr><td><strong>obwohl (Verb am Ende)</strong></td><td>although / even though</td><td>Ich gehe spazieren, obwohl es kalt ist.</td></tr><tr><td><strong>dass (Verb am Ende)</strong></td><td>that</td><td>Ich weiß, dass Grammatik Übung braucht.</td></tr><tr><td><strong>wenn (Verb am Ende)</strong></td><td>if / when(ever)</td><td>Wenn ich Feierabend habe, spiele ich Videospiele.</td></tr><tr><td><strong>als (Verb am Ende)</strong></td><td>when (single past event)</td><td>Als ich nach Berlin kam, war alles neu für mich.</td></tr><tr><td><strong>deshalb / deswegen (Pos. 2)</strong></td><td>therefore / that's why</td><td>Ich bin müde, deshalb trinke ich einen Kaffee.</td></tr><tr><td><strong>trotzdem (Pos. 2)</strong></td><td>nevertheless / anyway</td><td>Es regnet stark, trotzdem gehe ich zum Training.</td></tr><tr><td><strong>außerdem (Pos. 2)</strong></td><td>besides / furthermore</td><td>Der Job ist spannend, außerdem sind die Kollegen nett.</td></tr><tr><td><strong>denn (Pos. 0)</strong></td><td>because / for</td><td>Ich bleibe zu Hause, denn ich bin erkältet.</td></tr></tbody></table>"
      },
      {
        "sectionTitle": "Die 3 Konnektoren-Familien (Die Satzbau-Regeln)",
        "type": "grammar",
        "content": "<p>Im Deutschen bestimmt das Verbindungswort (der Konnektor), an welcher Position das konjugierte Verb steht. Es gibt <strong>drei feste Typen</strong>:</p><h4>1. Typ ENDE (Subjunktionen): weil, obwohl, dass, wenn</h4><p>Das konjugierte Verb wird an das <strong>allerletzte Ende</strong> des Nebensatzes gestellt.</p><ul><li><em>Ich trinke Kaffee, weil ich müde <strong>bin</strong>.</em></li><li><em>Ich gehe spazieren, obwohl es <strong>regnet</strong>.</em></li><li><em>Ich weiß, dass Berlin eine tolle Stadt <strong>ist</strong>.</em></li></ul><h4>2. Typ POSITION 2 (Konjunktionaladverbien): deshalb, deswegen, trotzdem, außerdem</h4><p>Diese Wörter besetzen Position 1. Das konjugierte Verb folgt <strong>sofort an Position 2</strong> (Inversion)!</p><ul><li><em>Ich bin müde. Deshalb <strong>trinke</strong> ich einen Kaffee.</em></li><li><em>Es regnet. Trotzdem <strong>gehe</strong> ich spazieren.</em></li><li><em>Berlin ist spannend. Außerdem <strong>wohnt</strong> meine Fast-Freundin hier.</em></li></ul><h4>3. Typ POSITION 0 (Koordinierende Konjunktionen): und, aber, denn, oder</h4><p>Diese Wörter verbinden zwei Hauptsätze, ohne die normale Wortstellung (Subjekt + Verb) zu verändern.</p><ul><li><em>Ich trinke Kaffee, denn ich <strong>bin</strong> müde.</em></li><li><em>Ich wohne in Berlin, aber ich <strong>arbeite</strong> viel.</em></li></ul>"
      },

        "type": "grammar",
        "content": "<table><thead><tr><th>Bedeutung</th><th>Typ ENDE (Nebensatz)</th><th>Typ POSITION 2 (Hauptsatz)</th><th>Typ POSITION 0</th></tr></thead><tbody><tr><td><strong>Grund (Cause)</strong></td><td><strong>weil</strong><br/>... weil ich lerne.</td><td><strong>deshalb / deswegen</strong><br/>... deshalb lerne ich.</td><td><strong>denn</strong><br/>... denn ich lerne.</td></tr><tr><td><strong>Gegensatz (Contrast)</strong></td><td><strong>obwohl</strong><br/>... obwohl es kalt ist.</td><td><strong>trotzdem</strong><br/>... trotzdem gehe ich raus.</td><td><strong>aber</strong><br/>... aber es ist kalt.</td></tr></tbody></table>"

/* Helper: Escape HTML string */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

/* State Management */
function getDefaultState() {
  return {
    completedLessons: {},
    xp: 0,
    streak: 1,

  };
}

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return { ...getDefaultState(), ...JSON.parse(raw) };
  } catch(e) {}
  return getDefaultState();
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

/* Sound Engine (Web Audio API) */
class SoundEngine {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playTone(freq, type, duration, delay = 0, gainLevel = 0.15) {
    if (!state.soundEnabled) return;
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const now = this.ctx.currentTime + delay;

      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(gainLevel, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(now);
      osc.stop(now + duration);
    } catch(e) {}
  }
  correct() {
    this.playTone(523.25, 'sine', 0.16, 0, 0.18);
    this.playTone(659.25, 'sine', 0.16, 0.08, 0.18);
    this.playTone(783.99, 'sine', 0.28, 0.16, 0.22);
  }
  wrong() {
    this.playTone(220, 'triangle', 0.2, 0, 0.2);
    this.playTone(174.61, 'triangle', 0.28, 0.1, 0.22);
  }
  click() {
    this.playTone(800, 'sine', 0.03, 0, 0.06);
  }
  fanfare() {
    this.playTone(523.25, 'sine', 0.15, 0, 0.2);
    this.playTone(659.25, 'sine', 0.15, 0.12, 0.2);
    this.playTone(783.99, 'sine', 0.2, 0.24, 0.25);
    this.playTone(1046.50, 'sine', 0.45, 0.4, 0.3);
  }
}

  state.soundEnabled = !state.soundEnabled;

}

/* Web Speech Engine */
let deVoice = null;
function initSpeech() {
  if (!('speechSynthesis' in window)) return;
  const updateVoices = () => {
    const voices = window.speechSynthesis.getVoices();
    deVoice = voices.find(v => v.lang.startsWith('de') && (v.name.includes('Google') || v.name.includes('Katja') || v.name.includes('Stefan') || v.name.includes('Anna'))) 
              || voices.find(v => v.lang.startsWith('de')) || null;
  };
  updateVoices();
  if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = updateVoices;
  }
}
initSpeech();

function speakGerman(text, rate = 1.0) {
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]*>/g, '').trim();
  if (!clean) return;

  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = 'de-DE';
  utter.rate = rate;
  if (deVoice) utter.voice = deVoice;
  window.speechSynthesis.speak(utter);
}

function playAudio(text, rate = 1.0) {
  speakGerman(text, rate);
}

/* XP, Streak & Level Helpers */
function addXp(amount) {
  state.xp += amount;
  saveState();
  updateXpDisplay();
}

function updateXpDisplay() {
  const currentLevel = Math.floor(state.xp / 100) + 1;
  const xpInLevel = state.xp % 100;
  
  const xpCurrentEl = document.getElementById('xp-current');
  const xpNextEl = document.getElementById('xp-next');
  const xpBarFillEl = document.getElementById('xp-bar-fill');
  const levelBadgeEl = document.getElementById('level-badge');
  const streakBadgeEl = document.getElementById('streak-badge');

  if (xpCurrentEl) xpCurrentEl.innerText = `${state.xp} XP`;
  if (xpNextEl) xpNextEl.innerText = `${currentLevel * 100} XP`;
  if (xpBarFillEl) xpBarFillEl.style.width = `${xpInLevel}%`;
  if (levelBadgeEl) levelBadgeEl.innerText = `⭐ Level ${currentLevel}`;
  if (streakBadgeEl) streakBadgeEl.innerText = `🔥 ${state.streak} Tage`;
}

function updateStreak() {
  const today = new Date().toISOString().split('T')[0];
  if (state.lastActiveDate !== today) {
    const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
    if (state.lastActiveDate === yesterday) {
      state.streak += 1;
    } else {
      state.streak = 1;
    }
    state.lastActiveDate = today;
    saveState();
  }
  updateXpDisplay();
}

function toggleFreeMode() {
  state.freeMode = !state.freeMode;
  saveState();
  const btn = document.getElementById('btn-unlock-toggle');
  if (btn) btn.innerText = state.freeMode ? '🔓 Alle freigeschaltet' : '🔒 Schritt für Schritt';
  showDashboard();
}

function changeLevel(level) {
  state.activeLevel = level;
  saveState();
  document.querySelectorAll('.level-tab-btn').forEach(b => {
    b.classList.toggle('active', b.innerText.includes(level));
  });
  showDashboard();
}

function switchNavMode(mode) {
  showDashboard();
  if (window.innerWidth <= 900) {
    document.getElementById('sidebar')?.classList.remove('open');
  }
}

function isLessonUnlocked(id) {
  if (state.freeMode) return true;
  if (id === 1 || id === 71) return true;
  const prevLesson = LESSONS.find(l => l.id === id - 1);
  if (!prevLesson) return true;
  return isLessonCompleted(prevLesson.id);
}

function isLessonCompleted(id) {
  return !!state.completedLessons[id];
}

function getLessonStars(id) {
  return state.completedLessons[id]?.stars || 0;
}

function getLessonLevel(id) {
  if (id >= 71 && id <= 75) return 'A1';
  if (id <= 20) return 'A2.1';
  if (id <= 40) return 'A2.2';
  return 'B1';
}

/* Spanish Speaker Context Helpers (Custom-tailored for Guillermo) */
function getSpanishTip(lesson) {
  const id = lesson.id;
  if (id === 71) {
    return "💡 <strong>Aussprache-Tipp für Hispanohablantes:</strong> La 'W' en alemán suena como nuestra 'V' (<em>Wasser</em> = 'Vasser'). Y 'EI' siempre suena como 'AI' en español (<em>mein</em> = 'main'), mientras que 'IE' suena como 'I' larga (<em>Bier</em> = 'Biir').";
  }
  if (id === 72) {
    return "💡 <strong>La Regla de Oro (Posición 2):</strong> En español el orden es libre ('Hoy trabajo en Berlín' o 'Yo hoy en Berlín trabajo'). En alemán, el verbo conjugado está <strong>SIEMPRE en Posición 2</strong>: <em>Heute [arbeite] ich in Berlin</em>.";
  }
  if (id === 73) {
    return "💡 <strong>El secreto del Acusativo:</strong> ¡Solo cambia el masculino! <em>der -> den</em> (<em>ein -> einen</em>). Femenino y neutro se quedan exactamente iguales: <em>Ich nehme einen Kaffee (masc), ein Wasser (neutro) und eine Brezel (fem).</em>";
  }
  if (id === 74) {
    return "💡 <strong>Números al revés y la media hora:</strong> A partir del 21 dices primero las unidades: <em>einundzwanzig</em> (uno y veinte). Y cuidado: <em>halb acht</em> NO es 8:30, ¡es 'media hora para las ocho', o sea las <strong>7:30</strong>!";
  }
  if (id === 75) {
    return "💡 <strong>Preguntas directas (W-Fragen):</strong> La palabra con W va primero, y el verbo va INMEDIATAMENTE en posición 2: <em>Wo [wohnst] du?</em>, <em>Wann [fängt] das Meeting an?</em>.";
  }
  if (id === 1) {
    return "💡 <strong>Ojo hispanohablantes:</strong> En español decimos <em>enojado CON</em> o <em>satisfecho CON</em>. En alemán, las preposiciones cambian: <strong>wütend auf + Akkusativ</strong> (enojado con) y <strong>zufrieden mit + Dativ</strong> (satisfecho con).";
  }
  if (id >= 5 && id <= 9) {
    return "💡 <strong>Wechselpräpositionen (en vs. a):</strong> En español usamos 'en' para posición y movimiento ('estoy en la cocina' vs 'voy en la cocina'). En alemán: <strong>Wo? (¿Dónde?) = Dativ</strong> (<em>in der Küche</em>), <strong>Wohin? (¿A dónde?) = Akkusativ</strong> (<em>in die Küche</em>).";
  }
  if (id >= 17 && id <= 20) {
    return "💡 <strong>Verbo al final con modales:</strong> En español dices 'debo <em>trabajar</em> hoy a las seis'. En alemán, el verbo modal va en 2ª posición y el infinitivo SIEMPRE al final absoluto: <em>Ich muss heute um sechs Uhr <strong>arbeiten</strong></em>.";
  }
  if (id === 21) {
    return "💡 <strong>Género contrastante:</strong> Cuidado con los géneros: <em>la sopa</em> = <strong>die Suppe</strong>, pero <em>el pan</em> = <strong>das Brot</strong> (neutro) y <em>la cerveza</em> = <strong>das Bier</strong> (neutro).";
  }
  if (id === 25) {
    return "💡 <strong>Medios de transporte:</strong> En español decimos 'voy <em>en</em> tren'. En alemán nunca se usa 'in', sino <strong>mit dem Zug</strong> / <strong>mit der U-Bahn</strong> (+ Dativ).";
  }
  if (id === 61) {
    return "💡 <strong>La regla de oro B1:</strong> <em>weil</em> (porque) y <em>obwohl</em> (aunque) lanzan el verbo conjugado al <strong>FINAL ABSOLUTO</strong> de la frase. <em>... weil ich in Berlin <strong>lebe</strong></em>.";
  }
  if (id === 62) {
    return "💡 <strong>Infinitivo con 'zu':</strong> Equivale a 'para + infinitivo' en español: <strong>um ... zu</strong> (<em>Ich lerne Deutsch, um einen Job zu finden</em>).";
  }
  return "💡 <strong>Tipp für Guillermo:</strong> Achte auf das grammatikalische Geschlecht (der/die/das) und sprich die Beispielsätze laut mit, um Akzent und Sprachmelodie zu festigen!";
}

/* ============================================
   15-MINUTE DAILY STUDY TIMER
   ============================================ */
let timerState = {
  totalSeconds: 15 * 60,
  remainingSeconds: 15 * 60,
  isRunning: false,
  intervalId: null
};

function formatTimerTime(secs) {
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function updateAllTimerDisplays() {
  const formatted = formatTimerTime(timerState.remainingSeconds);
  document.querySelectorAll('.timer-display-text').forEach(el => {
    el.innerText = formatted;
  });

  const sidebarCard = document.getElementById('sidebar-timer-card');
  const sidebarBadge = document.getElementById('sidebar-timer-badge');
  if (sidebarCard) {
    if (timerState.isRunning) sidebarCard.classList.add('running');
    else sidebarCard.classList.remove('running');
  }
  if (sidebarBadge) {
    sidebarBadge.innerText = timerState.isRunning ? 'Pause' : (timerState.remainingSeconds < timerState.totalSeconds ? 'Weiter' : 'Start');
  }

  document.querySelectorAll('.timer-pill, .runner-timer-pill').forEach(btn => {
    if (timerState.isRunning) btn.classList.add('running');
    else btn.classList.remove('running');
  });
}

function toggleDailyTimer() {
  soundEngine.click();
  if (timerState.isRunning) {
    pauseDailyTimer();
  } else {
    startDailyTimer();
  }
}

function startDailyTimer() {
  if (timerState.remainingSeconds <= 0) {
    timerState.remainingSeconds = timerState.totalSeconds;
  }
  timerState.isRunning = true;
  if (timerState.intervalId) clearInterval(timerState.intervalId);

  timerState.intervalId = setInterval(() => {
    if (timerState.remainingSeconds > 0) {
      timerState.remainingSeconds--;
      updateAllTimerDisplays();
    } else {
      finishDailyTimer();
    }
  }, 1000);

  updateAllTimerDisplays();
}

function pauseDailyTimer() {
  timerState.isRunning = false;
  if (timerState.intervalId) {
    clearInterval(timerState.intervalId);
    timerState.intervalId = null;
  }
  updateAllTimerDisplays();
}

function finishDailyTimer() {
  pauseDailyTimer();
  soundEngine.fanfare();
  addXp(50);
  launchConfetti();

  const existingAlert = document.getElementById('timer-finish-alert');
  if (existingAlert) existingAlert.remove();

  const alertBox = document.createElement('div');
  alertBox.id = 'timer-finish-alert';
  alertBox.className = 'timer-finish-overlay';
  alertBox.innerHTML = `
    <div class="timer-finish-card">
      <div style="font-size:3rem;margin-bottom:8px">🎉</div>
      <h2 style="color:#fff;font-size:1.5rem;font-weight:800;margin-bottom:6px">15 Minuten gemeistert!</h2>
      <div style="color:#34d399;font-size:1.05rem;font-weight:700;margin-bottom:12px">+50 Fokus-XP verdient ⚡</div>
      <p style="color:var(--text-secondary);font-size:0.92rem;line-height:1.5;margin-bottom:20px">
        Hervorragende Beständigkeit, Guillermo! Genau diese 15 Minuten täglicher Gewohnheit bringen dich fließend zur Goethe A2/B1 Prüfung.
      </p>
      <button class="btn-primary" style="width:100%" onclick="document.getElementById('timer-finish-alert').remove()">
        Weiterlernen →
      </button>
    </div>
  `;
  document.body.appendChild(alertBox);
}

/* ============================================
   BUSUU MICRO-LESSON RUNNER (CARD-BY-CARD FLOW)
   ============================================ */
let runnerState = {
  lesson: null,
  steps: [],
  currentStepIndex: 0,
  score: 0,
  viewMode: 'flow' // 'flow' | 'reference'
};

function startLessonFlow(lessonId) {
  const lesson = LESSONS.find(l => l.id === lessonId);
  if (!lesson) return;
  if (!isLessonUnlocked(lessonId)) return;

  state.currentLesson = lessonId;
  saveState();
  soundEngine.click();

  const vocabItems = extractVocabItems(lesson);
  const grammarSection = (lesson.lectureContent || []).find(s => s.type === 'grammar');
  const dialogueLines = lesson.dialogue || [];
  const exercises = lesson.exercises || [];

  const steps = [];

  // Step 1: Vocab Discovery (Target word 1)
  const v1 = vocabItems[0] || { de: lesson.titleDe, en: lesson.title, ex: 'Ich lerne Deutsch in Berlin.', exEn: 'I learn German in Berlin.' };
  steps.push({
    type: 'vocab_intro',
    title: 'Neues Wort entdecken',
    word: v1.de,
    gender: guessGender(v1.de),
    meaning: v1.en,
    example: v1.ex,
    exampleEn: v1.exEn || 'Example in context',
    spanishTip: getSpanishTip(lesson)
  });

  // Step 2: Immediate Recall Micro-Drill
  const recallOptions = buildRecallOptions(v1, vocabItems);
  steps.push({
    type: 'micro_drill',
    instruction: 'Wähle die richtige Bedeutung:',
    prompt: v1.de,
    options: recallOptions.options,
    correctIndex: recallOptions.correctIndex,
    explanation: `${v1.de} bedeutet auf Englisch ${v1.en}.`,
    answered: false,
    chosenIdx: null
  });

  // Step 3: Interactive Fill-in-the-Blank (Lückentext)
  const fillEx = exercises.find(e => e.type === 'fill_blank');
  if (fillEx && fillEx.sentence && fillEx.answer) {
    steps.push({
      type: 'fill_blank',
      title: 'Lückentext-Meister',
      instruction: fillEx.instruction || 'Ergänze das fehlende deutsche Wort:',
      sentence: fillEx.sentence,
      answer: fillEx.answer,
      hint: fillEx.hint || '',
      answered: false,
      userAnswer: ''
    });
  }

  // Step 4: Busuu Grammar Snapshot
  if (grammarSection) {
    steps.push({
      type: 'grammar_snapshot',
      title: 'Busuu Grammatik-Tipp',
      sectionTitle: grammarSection.sectionTitle,
      htmlContent: grammarSection.content,
      lessonId: lesson.id
    });
  }

  // Step 5: Interactive Word Matching Pairs (Wortpaare verbinden)
  const matchingEx = exercises.find(e => e.type === 'matching');
  if (matchingEx && matchingEx.pairs && matchingEx.pairs.length > 0) {
    const rawPairs = matchingEx.pairs.slice(0, 4).map(p => ({
      de: Array.isArray(p) ? p[0] : p.de,
      en: Array.isArray(p) ? p[1] : p.en
    }));
    steps.push({
      type: 'matching_pairs',
      title: 'Wortpaare verbinden',
      instruction: matchingEx.instruction || 'Tippe auf das deutsche Wort und die passende Bedeutung:',
      pairs: rawPairs,
      leftItems: rawPairs.map((p, i) => ({ id: i, text: p.de })).sort(() => Math.random() - 0.5),
      rightItems: rawPairs.map((p, i) => ({ id: i, text: p.en })).sort(() => Math.random() - 0.5),
      matchedIds: [],
      selectedLeft: null,
      selectedRight: null
    });
  }

  // Step 6: Native Dialogue in Action
  if (dialogueLines.length > 0) {
    steps.push({
      type: 'dialogue',
      title: 'Echtes Gespräch in Berlin',
      dialogue: dialogueLines
    });
  }

  // Step 5: Sentence Builder (Word Tiles)
  const reorderEx = exercises.find(e => e.type === 'reorder') || {
    answer: v1.ex || `${v1.de} ist wichtig für mich.`
  };
  const rawSentence = reorderEx.answer || 'Ich lerne Deutsch.';
  const rawTokens = rawSentence.replace(/[.!?]/g, '').trim().split(/\s+/);
  steps.push({
    type: 'sentence_builder',
    title: 'Satzbau-Meister',
    targetSentence: rawSentence,
    shuffledTokens: [...rawTokens].sort(() => Math.random() - 0.5),
    dropTokens: []
  });

  // Step 6: Active Production (Speaking / Writing with Herr Professor)
  steps.push({
    type: 'active_production',
    title: 'Jetzt bist du dran: Sprich oder schreibe!',
    prompt: lesson.goetheWriting?.situation || `Schreibe oder sprich 1–2 Sätze über das Thema "${lesson.titleDe}".`,
    points: lesson.goetheWriting?.points || ['Beschreibe kurz deine Situation.', 'Nutze weil oder deshalb.'],
    modelAnswer: lesson.goetheWriting?.modelAnswer || 'Hallo! Ich bin in Berlin und lerne Deutsch.'
  });

  // Step 7: Celebration Screen
  steps.push({
    type: 'celebration',
    title: 'Lektion abgeschlossen!',
    lessonId: lesson.id
  });

  runnerState = {
    lesson: lesson,
    steps: steps,
    currentStepIndex: 0,
    score: 0,
    viewMode: 'flow'
  };

  renderRunner();
}

function renderRunner() {
  const { lesson, steps, currentStepIndex, viewMode } = runnerState;
  const currentStep = steps[currentStepIndex];
  const progressPct = Math.round(((currentStepIndex) / (steps.length - 1)) * 100);

  let html = `
    <div class="busuu-runner">
      <!-- Runner Top Bar -->
      <div class="runner-topbar">
        <button class="btn-runner-close" onclick="showDashboard()" title="Zurück zum Lernpfad">✕</button>
        
        <div class="runner-progress-container" title="Fortschritt">
          <div class="runner-progress-fill" style="width:${progressPct}%"></div>
        </div>

        <button class="runner-timer-pill ${timerState.isRunning ? 'running' : ''}" onclick="toggleDailyTimer()" title="15-Minuten-Fokustimer">
          ⏱️ <span class="timer-display-text">${formatTimerTime(timerState.remainingSeconds)}</span>
        </button>

        <div class="runner-step-badge">
          Schritt ${currentStepIndex + 1} von ${steps.length}
        </div>

        <button class="runner-mode-toggle" onclick="toggleRunnerViewMode()">
          ${viewMode === 'flow' ? '📖 Alle Inhalte (Referenz)' : '⚡ Busuu Flow'}
        </button>
      </div>
  `;

  if (viewMode === 'reference') {
    html += renderReferenceView(lesson);
  } else {
    html += `
      <div class="runner-card" id="runner-card-content">
        ${renderRunnerStepContent(currentStep, currentStepIndex)}
      </div>
    `;
  }

  html += `</div>`;
  document.getElementById('main-content').innerHTML = html;

  // Auto-play audio on Step 1 (Vocab) if sound enabled
  if (currentStep.type === 'vocab_intro' && state.soundEnabled) {
    setTimeout(() => speakGerman(currentStep.word), 400);
  }

  // Trigger celebration effects on final step
  if (currentStep.type === 'celebration') {
    onLessonCompleted(lesson.id);
  }
}

function toggleRunnerViewMode() {
  runnerState.viewMode = runnerState.viewMode === 'flow' ? 'reference' : 'flow';
  renderRunner();
}

function nextRunnerStep() {
  soundEngine.click();
  if (runnerState.currentStepIndex < runnerState.steps.length - 1) {
    runnerState.currentStepIndex++;
    renderRunner();
  }
}


function insertFillBlankUmlaut(char) {
  const inp = document.getElementById('fill-blank-input');
  if (!inp) return;
  const start = inp.selectionStart;
  const end = inp.selectionEnd;
  inp.value = inp.value.substring(0, start) + char + inp.value.substring(end);
  inp.focus();
  inp.selectionStart = inp.selectionEnd = start + 1;
}

function handleFillBlankCheck() {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || step.type !== 'fill_blank') return;
  if (step.answered) return;

  const inp = document.getElementById('fill-blank-input');
  const btn = document.getElementById('btn-check-blank');
  const container = document.getElementById('fill-blank-feedback-container');
  const targetPlaceholder = document.getElementById('fill-blank-target');
  if (!inp) return;

  const val = inp.value.trim();
  if (!val) return;

  step.answered = true;
  step.userAnswer = val;

  const cleanUser = val.toLowerCase().replace(/[.,!?:;]/g, '');
  const cleanAns = step.answer.toLowerCase().replace(/[.,!?:;]/g, '');

  const isCorrect = (cleanUser === cleanAns);

  if (targetPlaceholder) {
    targetPlaceholder.innerText = step.answer;
  }

  if (isCorrect) {
    soundEngine.correct();
    addXp(10);
    inp.classList.add('correct');
    speakGerman(step.sentence.replace('___', step.answer));
    if (container) {
      container.innerHTML = `
        <div class="runner-feedback-sheet correct">
          <div>
            <div class="feedback-text-title">✓ Richtig gelöst!</div>
            <div class="feedback-text-desc">„${escapeHtml(step.sentence.replace('___', step.answer))}“</div>
          </div>
          <button class="btn-primary" id="btn-feedback-next" style="padding:10px 22px" onclick="nextRunnerStep()">
            Weiter →
          </button>
        </div>
      `;
    }
  } else {
    soundEngine.wrong();
    inp.classList.add('wrong');
    if (container) {
      container.innerHTML = `
        <div class="runner-feedback-sheet wrong">
          <div>
            <div class="feedback-text-title">Fast richtig!</div>
            <div class="feedback-text-desc">Die richtige Antwort ist: <strong>${escapeHtml(step.answer)}</strong></div>
          </div>
          <button class="btn-secondary" id="btn-feedback-next" style="padding:10px 22px" onclick="nextRunnerStep()">
            Weiter →
          </button>
        </div>
      `;
    }
  }

  if (btn) {
    btn.style.display = 'none';
  }
  inp.disabled = true;
  setTimeout(() => document.getElementById('btn-feedback-next')?.focus(), 100);
}

function updateMatchingUI() {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || step.type !== 'matching_pairs') return;

  step.leftItems.forEach(item => {
    const el = document.getElementById(`match-left-${item.id}`);
    if (!el) return;
    el.className = 'matching-card';
    if (step.matchedIds.includes(item.id)) {
      el.classList.add('matched');
      el.innerHTML = `✓ ${escapeHtml(item.text)}`;
    } else if (step.selectedLeft === item.id) {
      el.classList.add('selected');
      el.innerHTML = escapeHtml(item.text);
    } else {
      el.innerHTML = escapeHtml(item.text);
    }
  });

  step.rightItems.forEach(item => {
    const el = document.getElementById(`match-right-${item.id}`);
    if (!el) return;
    el.className = 'matching-card';
    if (step.matchedIds.includes(item.id)) {
      el.classList.add('matched');
      el.innerHTML = `✓ ${escapeHtml(item.text)}`;
    } else if (step.selectedRight === item.id) {
      el.classList.add('selected');
      el.innerHTML = escapeHtml(item.text);
    } else {
      el.innerHTML = escapeHtml(item.text);
    }
  });
}

function handleMatchCardClick(side, id) {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || step.type !== 'matching_pairs') return;
  if (step.matchedIds.includes(id)) return;

  soundEngine.click();

  if (side === 'left') {
    step.selectedLeft = id;
    if (step.pairs[id]) {
      speakGerman(step.pairs[id].de);
    }
  } else {
    step.selectedRight = id;
  }

  updateMatchingUI();

  // If both left and right are selected, evaluate match
  if (step.selectedLeft !== null && step.selectedRight !== null) {
    const leftId = step.selectedLeft;
    const rightId = step.selectedRight;

    if (leftId === rightId) {
      // Match!
      soundEngine.correct();
      addXp(5);
      step.matchedIds.push(leftId);
      step.selectedLeft = null;
      step.selectedRight = null;
      updateMatchingUI();

      if (step.matchedIds.length === step.pairs.length) {
        soundEngine.fanfare();
        addXp(10);
        const container = document.getElementById('matching-feedback-container');
        if (container) {
          container.innerHTML = `
            <div class="runner-feedback-sheet correct" style="margin-top:16px">
              <div>
                <div class="feedback-text-title">🎉 Alle Wortpaare verbunden!</div>
                <div class="feedback-text-desc">Großartige Arbeit, Guillermo! Alle Paare gemeistert.</div>
              </div>
              <button class="btn-primary" id="btn-feedback-next" style="padding:10px 22px" onclick="nextRunnerStep()">
                Weiter →
              </button>
            </div>
          `;
          setTimeout(() => document.getElementById('btn-feedback-next')?.focus(), 100);
        }
      }
    } else {
      // Mismatch
      soundEngine.wrong();
      const elLeft = document.getElementById(`match-left-${leftId}`);
      const elRight = document.getElementById(`match-right-${rightId}`);
      if (elLeft) elLeft.classList.add('wrong');
      if (elRight) elRight.classList.add('wrong');

      setTimeout(() => {
        step.selectedLeft = null;
        step.selectedRight = null;
        updateMatchingUI();
      }, 500);
    }
  }
}



function handleDrillAnswer(chosenIdx) {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || step.type !== 'micro_drill') return;
  if (step.answered) return;

  step.answered = true;
  step.chosenIdx = chosenIdx;

  const isCorrect = chosenIdx === step.correctIndex;
  const container = document.getElementById('drill-feedback-container');
  const btn = document.getElementById(`drill-opt-${chosenIdx}`);

  // Disable all options
  document.querySelectorAll('.drill-option-btn').forEach(b => b.style.pointerEvents = 'none');

  if (isCorrect) {
    soundEngine.correct();
    if (btn) btn.classList.add('selected-correct');
    addXp(5);
    if (container) {
      container.innerHTML = `
        <div class="runner-feedback-sheet correct">
          <div>
            <div class="feedback-text-title">✓ Ausgezeichnet!</div>
            <div class="feedback-text-desc">${escapeHtml(step.explanation)}</div>
          </div>
          <button class="btn-primary" id="btn-feedback-next" style="padding:10px 22px" onclick="nextRunnerStep()">
            Weiter →
          </button>
        </div>
      `;
    }
  } else {
    soundEngine.wrong();
    if (btn) btn.classList.add('selected-wrong');
    const correctBtn = document.getElementById(`drill-opt-${step.correctIndex}`);
    if (correctBtn) correctBtn.classList.add('selected-correct');

    if (container) {
      container.innerHTML = `
        <div class="runner-feedback-sheet wrong">
          <div>
            <div class="feedback-text-title">Fast richtig!</div>
            <div class="feedback-text-desc">${escapeHtml(step.explanation)}</div>
          </div>
          <button class="btn-secondary" id="btn-feedback-next" style="padding:10px 22px" onclick="nextRunnerStep()">
            Weiter →
          </button>
        </div>
      `;
    }
  }

  setTimeout(() => document.getElementById('btn-feedback-next')?.focus(), 100);
}

function handleTileClick(wIdx) {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || step.type !== 'sentence_builder') return;
  const word = step.shuffledTokens[wIdx];
  soundEngine.click();

  const tileEl = document.getElementById(`tile-${wIdx}`);
  if (tileEl) tileEl.classList.add('disabled');

  step.dropTokens.push({ word, wIdx });
  renderDropTokens();
}

function removeLastTile() {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || !step.dropTokens || step.dropTokens.length === 0) return;
  const last = step.dropTokens.pop();
  const tileEl = document.getElementById(`tile-${last.wIdx}`);
  if (tileEl) tileEl.classList.remove('disabled');
  renderDropTokens();
}

function renderDropTokens() {
  const step = runnerState.steps[runnerState.currentStepIndex];
  const dropzone = document.getElementById('tiles-dropzone');
  if (!dropzone || !step) return;

  if (!step.dropTokens || step.dropTokens.length === 0) {
    dropzone.innerHTML = `<span style="color:var(--text-muted);font-size:0.85rem">Wähle Wörter unten aus...</span>`;
    dropzone.classList.remove('filled');
    return;
  }

  dropzone.classList.add('filled');
  dropzone.innerHTML = step.dropTokens.map(item => `
    <div class="tile-chip in-drop">${escapeHtml(item.word)}</div>
  `).join('');
}

function checkSentenceTiles() {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || step.type !== 'sentence_builder') return;

  const assembled = (step.dropTokens || []).map(t => t.word).join(' ').trim();
  const cleanTarget = step.targetSentence.replace(/[.!?]/g, '').trim();
  const box = document.getElementById('tile-feedback-box');
  const btn = document.getElementById('btn-check-tiles');

  if (assembled.toLowerCase() === cleanTarget.toLowerCase()) {
    soundEngine.correct();
    speakGerman(step.targetSentence);
    addXp(10);
    if (box) {
      box.innerHTML = `
        <div class="runner-feedback-sheet correct" style="margin-bottom:16px">
          <div>
            <div class="feedback-text-title">✓ Perfekt zusammengesetzt!</div>
            <div class="feedback-text-desc">„${escapeHtml(step.targetSentence)}“</div>
          </div>
        </div>
      `;
    }
    if (btn) {
      btn.innerText = 'Weiter →';
      btn.onclick = nextRunnerStep;
      btn.focus();
    }
  } else {
    soundEngine.wrong();
    if (box) {
      box.innerHTML = `
        <div class="runner-feedback-sheet wrong" style="margin-bottom:16px">
          <div>
            <div class="feedback-text-title">Nicht ganz richtig</div>
            <div class="feedback-text-desc">Richtige Reihenfolge: <strong>${escapeHtml(step.targetSentence)}</strong></div>
          </div>
        </div>
      `;
    }
    if (btn) {
      btn.innerText = 'Weiter →';
      btn.onclick = nextRunnerStep;
      btn.focus();
    }
  }
}

function insertRunnerUmlaut(char) {
  const tx = document.getElementById('runner-production-text');
  if (!tx) return;
  const start = tx.selectionStart;
  const end = tx.selectionEnd;
  tx.value = tx.value.substring(0, start) + char + tx.value.substring(end);
  tx.focus();
  tx.selectionStart = tx.selectionEnd = start + 1;
}

let runnerRecognition = null;
function toggleRunnerMic() {
  const btn = document.getElementById('btn-runner-mic');
  const tx = document.getElementById('runner-production-text');
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRec) {
    alert('Spracherkennung wird von diesem Browser nicht nativ unterstützt. Bitte verwende Chrome oder Edge!');
    return;
  }

  if (runnerRecognition) {
    runnerRecognition.stop();
    runnerRecognition = null;
    if (btn) btn.classList.remove('recording');
    return;
  }

  runnerRecognition = new SpeechRec();
  runnerRecognition.lang = 'de-DE';
  runnerRecognition.continuous = false;
  runnerRecognition.interimResults = false;

  runnerRecognition.onstart = () => {
    if (btn) btn.classList.add('recording');
    btn.innerText = '🔴 Aufnahme läuft... Sprich jetzt!';
  };

  runnerRecognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    if (tx) tx.value += (tx.value ? ' ' : '') + transcript;
  };

  runnerRecognition.onerror = () => {
    if (btn) {
      btn.classList.remove('recording');
      btn.innerText = '🎤 Spracheingabe';
    }
  };

  runnerRecognition.onend = () => {
    if (btn) {
      btn.classList.remove('recording');
      btn.innerText = '🎤 Spracheingabe';
    }
    runnerRecognition = null;
  };

  runnerRecognition.start();
}

function gradeRunnerWithProfessor() {
  const text = (document.getElementById('runner-production-text')?.value || '').trim();
  const box = document.getElementById('runner-prof-feedback');
  if (!box) return;

  if (!text) {
    alert('Bitte schreibe zuerst einen Satz auf Deutsch oder nutze das Mikrofon!');
    return;
  }

  box.style.display = 'block';
  box.innerHTML = `<div style="color:#fbbf24;padding:12px;text-align:center">👨‍🏫 Herr Professor analysiert deinen Satzbau...</div>`;

  setTimeout(() => {
    let corrections = [];
    if (/weil\s+([a-zäöü]+)\s+(bin|habe|ist|kann|muss|wohne|arbeite)/i.test(text)) {
      corrections.push(`⚠️ <strong>Verbstellung bei „weil“:</strong> Das Verb muss ans Satzende: <em>... weil ich in Berlin <strong>arbeite</strong></em>.`);
    }
    if (/obwohl\s+([a-zäöü]+)\s+(bin|habe|ist|kann|muss)/i.test(text)) {
      corrections.push(`⚠️ <strong>Verbstellung bei „obwohl“:</strong> Auch hier gehört das Verb ans Satzende!`);
    }

    let html = `
      <div class="berlin-example-box" style="border-color:#fbbf24">
        <div style="font-weight:700;color:#fbbf24;margin-bottom:6px">👨‍🏫 Urteil von Herrn Professor:</div>
        <div style="font-size:0.9rem;line-height:1.45;color:var(--text-primary)">
          ${corrections.length > 0 ? corrections.join('<br>') : '✅ <strong>Sehr gut gemacht!</strong> Der Satzbau und die Verbstellung stimmen mit den A2/B1-Regeln überein.'}
        </div>
        <div style="font-size:0.78rem;color:var(--text-secondary);margin-top:8px">
          💡 <em>Tipp:</em> Du kannst diesen Satz auch direkt in den Professor-Chat kopieren für ausführliche Konversation!
        </div>
      </div>
    `;
    box.innerHTML = html;
    addXp(10);
  }, 350);
}

function toggleRunnerModelAnswer() {
  const step = runnerState.steps[runnerState.currentStepIndex];
  const box = document.getElementById('runner-prof-feedback');
  if (!box || !step) return;
  box.style.display = 'block';
  box.innerHTML = `

    </div>

function playAllDialogue() {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || !step.dialogue) return;

  let delay = 0;
  step.dialogue.forEach(line => {
    setTimeout(() => speakGerman(line.de), delay);
    delay += Math.max(2200, line.de.split(' ').length * 400);
  });
}

function onLessonCompleted(lessonId) {
  soundEngine.fanfare();
  state.completedLessons[lessonId] = {
    stars: 3,
    score: 100,
    completedAt: new Date().toISOString()
  };
  addXp(30);
  updateStreak();

}

function finishLessonAndGoNext() {
  const nextId = runnerState.lesson.id + 1;
  const nextLesson = LESSONS.find(l => l.id === nextId);

  if (nextLesson && isLessonUnlocked(nextId)) {
    startLessonFlow(nextId);
  } else {
    showDashboard();
  }
}

/* Confetti Particle System */
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  if (!canvas || typeof canvas.getContext !== 'function') return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;

  const pieces = [];
  const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#fbbf24'];

  for (let i = 0; i < 70; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      speedY: Math.random() * 4 + 2,
      speedX: (Math.random() - 0.5) * 3,
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 8
    });
  }

  let animationFrame;
  let elapsed = 0;

  function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.y += p.speedY;
      p.x += p.speedX;
      p.rotation += p.rotationSpeed;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    });

    elapsed++;
    if (elapsed < 140) {
      animationFrame = requestAnimationFrame(update);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  update();
}

/* Global Keyboard Interaction */
document.addEventListener('keydown', (e) => {
  // Ignore typing inside inputs/textareas
  if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;

  if (runnerState.lesson && runnerState.viewMode === 'flow') {
    const step = runnerState.steps[runnerState.currentStepIndex];
    if (!step) return;

    // Enter key: next or check
    if (e.key === 'Enter') {
      e.preventDefault();
      if (step.type === 'micro_drill') {
        if (step.answered) nextRunnerStep();
      } else if (step.type === 'sentence_builder') {
        const btn = document.getElementById('btn-check-tiles');
        if (btn && btn.innerText.includes('Weiter')) nextRunnerStep();
        else checkSentenceTiles();
      } else if (step.type === 'celebration') {
        finishLessonAndGoNext();
      } else {
        nextRunnerStep();
      }
      return;
    }

    // Space key: replay audio on vocab or drill prompt
    if (e.key === ' ') {
      e.preventDefault();
      if (step.type === 'vocab_intro') speakCurrentStepWord();
      else if (step.type === 'micro_drill') speakCurrentStepPrompt();
      return;
    }

    // Number keys 1-4 or A-D for micro-drill options
    if (step.type === 'micro_drill' && !step.answered) {
      if (['1', '2', '3', '4'].includes(e.key)) {
        e.preventDefault();
        handleDrillAnswer(parseInt(e.key) - 1);
      } else if (['a', 'b', 'c', 'd'].includes(e.key.toLowerCase())) {
        e.preventDefault();
        const map = { a: 0, b: 1, c: 2, d: 3 };
        handleDrillAnswer(map[e.key.toLowerCase()]);
      }
    }
  }
});

/* Helpers to Extract Vocab and Build Recalls */
function extractVocabItems(lesson) {
  const items = [];
  (lesson.lectureContent || []).forEach(sec => {
    if (sec.type === 'vocabulary') {
      const rowMatches = sec.content.matchAll(/<tr>\s*<td>(<strong>)?([^<]+)(<\/strong>)?<\/td>\s*<td>([^<]+)<\/td>\s*<td>([^<]*)<\/td>/gi);
      for (const m of rowMatches) {
        items.push({
          de: m[2].trim(),
          en: m[4].trim(),
          ex: m[5].trim() || 'Ich mag das sehr.'
        });
      }
    }
  });
  return items;
}

function guessGender(deWord) {
  const lower = deWord.toLowerCase();
  if (lower.startsWith('der ') || lower.includes('(der)')) return 'der';
  if (lower.startsWith('die ') || lower.includes('(die)')) return 'die';
  if (lower.startsWith('das ') || lower.includes('(das)')) return 'das';
  return 'other';
}

function buildRecallOptions(correctItem, allItems) {
  const distractors = allItems
    .filter(it => it.en !== correctItem.en)
    .map(it => it.en);
  
  const fallbacks = ['to arrive', 'friendly', 'happy', 'busy', 'because of', 'together'];
  while (distractors.length < 3) {
    distractors.push(fallbacks.pop());
  }

  const chosenDistractors = distractors.sort(() => Math.random() - 0.5).slice(0, 3);
  const options = [...chosenDistractors, correctItem.en].sort(() => Math.random() - 0.5);
  const correctIndex = options.indexOf(correctItem.en);

  return { options, correctIndex };
}

/* Theme Management (Pastel Tag & Pastel Nacht) */
function initTheme() {
  const saved = localStorage.getItem('deutschmeister_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeButton(saved);
}

function toggleTheme() {
  soundEngine.click();
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('deutschmeister_theme', next);
  updateThemeButton(next);
}

function updateThemeButton(theme) {
  const btn = document.getElementById('btn-theme-toggle');
  if (btn) {
    btn.innerText = theme === 'light' ? '🌸 Pastel Tag' : '🌙 Pastel Nacht';
  }
}

/* Initialization */
initTheme();
updateStreak();
showDashboard();
