<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__APP_TITLE__</title>
<meta name="description" content="__APP_DESCRIPTION__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>

/* ============================================
   DEUTSCHMEISTER — PREMIUM MODERN DESIGN SYSTEM
   Inspired by Busuu & Linear Dark Mode
   ============================================ */
:root {
  --bg-canvas: #0a0d14;
  --bg-surface: #111827;
  --bg-surface-elevated: #1e293b;
  --bg-surface-card: #182234;
  --bg-card: rgba(30, 41, 59, 0.7);
  --bg-card-hover: rgba(51, 65, 85, 0.85);
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-medium: rgba(255, 255, 255, 0.14);
  --border-focus: #3b82f6;
  
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  
  /* Brand Accents */
  --brand-blue: #3b82f6;
  --brand-blue-hover: #2563eb;
  --brand-blue-dark: #1d4ed8;
  --brand-blue-glow: rgba(59, 130, 246, 0.35);
  
  --brand-green: #10b981;
  --brand-green-hover: #059669;
  --brand-green-glow: rgba(16, 185, 129, 0.35);
  
  --brand-amber: #f59e0b;
  --brand-amber-light: #fbbf24;
  --brand-amber-glow: rgba(245, 158, 11, 0.35);
  
  --brand-red: #ef4444;
  --brand-red-glow: rgba(239, 68, 68, 0.3);
  
  --brand-purple: #8b5cf6;
  --brand-purple-glow: rgba(139, 92, 246, 0.3);
  
  /* Typography */
  --font-main: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  
  /* Radii */
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-full: 9999px;
  
  /* Shadows & Depth */
  --shadow-sm: 0 2px 4px rgba(0,0,0,0.2);
  --shadow-md: 0 6px 18px rgba(0,0,0,0.35);
  --shadow-lg: 0 12px 35px -5px rgba(0,0,0,0.5), 0 0 1px 1px rgba(255,255,255,0.06);
  --shadow-glow-blue: 0 0 25px var(--brand-blue-glow);
  --shadow-glow-green: 0 0 25px var(--brand-green-glow);
  --shadow-glow-amber: 0 0 25px var(--brand-amber-glow);
  
  --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-main);
  background-color: var(--bg-canvas);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* App Shell */
#app { display: flex; width: 100%; min-height: 100vh; }

/* ============================================
   SIDEBAR
   ============================================ */
.sidebar {
  width: 280px;
  background-color: var(--bg-surface);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  bottom: 0;
  left: 0;
  z-index: 100;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
}
.sidebar::-webkit-scrollbar { width: 5px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

.sidebar-header {
  padding: 24px 20px 18px;
  border-bottom: 1px solid var(--border-subtle);
}
.sidebar-header h1 {
  font-size: 1.3rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
}
.sidebar-header h1 span {
  background: linear-gradient(135deg, #60a5fa, #3b82f6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.sidebar-header .subtitle {
  font-size: 0.76rem;
  color: var(--text-secondary);
  margin-top: 4px;
}

/* Nav Modes */
.nav-modes {
  padding: 16px 14px 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.nav-mode-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  text-align: left;
  width: 100%;
}
.nav-mode-btn:hover {
  background: var(--bg-surface-elevated);
  color: var(--text-primary);
}
.nav-mode-btn.active {
  background: linear-gradient(135deg, rgba(59,130,246,0.18), rgba(59,130,246,0.06));
  color: #60a5fa;
  border-color: rgba(59,130,246,0.35);
  font-weight: 700;
}
.nav-mode-badge {
  margin-left: auto;
  font-size: 0.65rem;
  padding: 2px 7px;
  border-radius: var(--radius-full);
  background: rgba(59,130,246,0.25);
  color: #93c5fd;
  font-weight: 700;
}

/* User Progress Bar in Sidebar */
.xp-bar-container {
  padding: 14px 16px;
  margin: 6px 14px;
  background: var(--bg-surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
}
.xp-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.74rem;
  color: var(--text-secondary);
  font-weight: 600;
  margin-bottom: 8px;
}
.xp-bar {
  height: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.xp-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #f59e0b, #fbbf24);
  border-radius: var(--radius-full);
  transition: width 0.4s ease;
}
.level-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.76rem;
  font-weight: 700;
  color: #fbbf24;
}
.streak-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.76rem;
  font-weight: 700;
  color: #f97316;
}

/* Level Tabs */
.level-tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: rgba(0,0,0,0.3);
  margin: 6px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
}
.level-tab-btn {
  flex: 1;
  padding: 8px 4px;
  border-radius: var(--radius-xs);
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  text-align: center;
}
.level-tab-btn:hover { color: var(--text-primary); }
.level-tab-btn.active {
  background: var(--brand-blue);
  color: #fff;
  box-shadow: 0 2px 8px rgba(59,130,246,0.45);
}

/* Sidebar Options */
.sidebar-options {
  padding: 6px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.76rem;
  color: var(--text-muted);
}
.toggle-pill {
  padding: 5px 12px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface-elevated);
  color: var(--text-secondary);
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}
.toggle-pill:hover {
  background: rgba(255,255,255,0.12);
  color: var(--text-primary);
  border-color: var(--border-medium);
}

/* ============================================
   MAIN CONTENT AREA
   ============================================ */
.main-content {
  margin-left: 280px;
  flex: 1;
  min-height: 100vh;
  padding: 24px 36px 120px;
  max-width: 1100px;
}

/* Top Sticky Navigation Pill */
.timeline-top-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
  background: linear-gradient(135deg, rgba(30, 41, 59, 0.7), rgba(17, 24, 39, 0.8));
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 14px 22px;
  margin-bottom: 36px;
  box-shadow: var(--shadow-lg);
}
.course-identity {
  display: flex;
  align-items: center;
  gap: 14px;
}
.flag-avatar {
  font-size: 2rem;
  line-height: 1;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
}
.course-name {
  font-weight: 800;
  font-size: 1.15rem;
  letter-spacing: -0.01em;
  color: #fff;
}
.course-sub {
  font-size: 0.78rem;
  color: var(--text-secondary);
}

.top-stats-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--radius-full);
  background: var(--bg-surface-elevated);
  border: 1px solid var(--border-subtle);
  font-size: 0.82rem;
  font-weight: 700;
  box-shadow: var(--shadow-sm);
}
.stat-pill.streak { color: #f97316; border-color: rgba(249,115,22,0.25); }
.stat-pill.xp { color: #fbbf24; border-color: rgba(251,191,36,0.25); }
.stat-pill.level { color: #60a5fa; border-color: rgba(96,165,250,0.25); }

.sound-toggle-btn {
  background: var(--bg-surface-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-full);
  padding: 7px 12px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 0.9rem;
  transition: var(--transition);
}
.sound-toggle-btn:hover {
  color: var(--text-primary);
  border-color: var(--border-medium);
  transform: scale(1.05);
}

/* ============================================
   BUSUU TIMELINE (STEPPING-STONE LEARNING PATH)
   ============================================ */
.busuu-timeline {
  max-width: 680px;
  margin: 0 auto;
  position: relative;
}

/* Chapter Card Banner */
.timeline-chapter {
  margin-bottom: 70px;
  position: relative;
}
.chapter-banner {
  background: linear-gradient(145deg, #182234, #0f172a);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-lg);
  padding: 24px 28px;
  margin-bottom: 40px;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.chapter-banner::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 6px;
  height: 100%;
  background: linear-gradient(180deg, var(--brand-blue), var(--brand-purple));
  border-radius: 6px 0 0 6px;
}
.chapter-badge {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #60a5fa;
  margin-bottom: 6px;
}
.chapter-title {
  font-size: 1.4rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: #fff;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.chapter-desc {
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 16px;
}
.chapter-progress-box {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 0.8rem;
  color: var(--text-muted);
}
.chapter-progress-bar {
  flex: 1;
  height: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.chapter-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #10b981, #34d399);
  border-radius: var(--radius-full);
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Stepping-Stone Track */
.path-track {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 36px;
  position: relative;
  padding: 10px 0;
}

/* Vertical Continuous Connecting Trail */
.path-track::before {
  content: '';
  position: absolute;
  top: 10px;
  bottom: 20px;
  width: 6px;
  background: repeating-linear-gradient(
    180deg,
    rgba(255, 255, 255, 0.12),
    rgba(255, 255, 255, 0.12) 10px,
    transparent 10px,
    transparent 20px
  );
  border-radius: var(--radius-full);
  z-index: 1;
}

/* Stepping Stone Row */
.stone-row {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 2;
  width: 100%;
}
.stone-row.stagger-left { transform: translateX(-65px); }
.stone-row.stagger-center { transform: translateX(0); }
.stone-row.stagger-right { transform: translateX(65px); }

/* The Stone Container */
.stone-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  position: relative;
  transition: var(--transition);
}
.stone-container:hover {
  transform: translateY(-4px);
}

/* Tactile 3D Circular Stone Button */
.stone-circle {
  width: 80px;
  height: 80px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.85rem;
  position: relative;
  transition: var(--transition);
  user-select: none;
}

/* States with Tactile 3D Depths (Busuu & Duolingo style) */
.stone-circle.completed {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  border: 3px solid #34d399;
  box-shadow: 0 8px 0 #047857, 0 12px 24px var(--brand-green-glow);
  color: #fff;
}
.stone-circle.completed:active {
  transform: translateY(6px);
  box-shadow: 0 2px 0 #047857, 0 6px 14px var(--brand-green-glow);
}

.stone-circle.active {
  width: 88px;
  height: 88px;
  background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
  border: 3px solid #93c5fd;
  box-shadow: 0 9px 0 #1e40af, 0 15px 30px var(--brand-blue-glow);
  color: #fff;
}
.stone-circle.active:active {
  transform: translateY(7px);
  box-shadow: 0 2px 0 #1e40af, 0 6px 16px var(--brand-blue-glow);
}

.stone-circle.locked {
  background: #1e293b;
  border: 2px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 6px 0 #0f172a;
  color: #64748b;
  opacity: 0.7;
}

/* Pulsing Halo on Active Stone */
@keyframes pulse-ring {
  0% { transform: scale(0.96); opacity: 0.85; }
  50% { transform: scale(1.22); opacity: 0; }
  100% { transform: scale(0.96); opacity: 0; }
}
.stone-circle.active::before {
  content: '';
  position: absolute;
  top: -12px;
  left: -12px;
  right: -12px;
  bottom: -12px;
  border-radius: var(--radius-full);
  border: 3px solid #60a5fa;
  animation: pulse-ring 2.2s infinite cubic-bezier(0.4, 0, 0.6, 1);
  pointer-events: none;
}

/* "START HIER" Floating Badge */
.start-here-beacon {
  position: absolute;
  top: -36px;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #fff;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  padding: 5px 14px;
  border-radius: var(--radius-full);
  box-shadow: 0 4px 14px var(--brand-amber-glow);
  white-space: nowrap;
  animation: bounce-gentle 1.8s infinite;
  display: flex;
  align-items: center;
  gap: 5px;
  z-index: 5;
}
.start-here-beacon::after {
  content: '';
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 6px 6px 0;
  border-style: solid;
  border-color: #d97706 transparent transparent;
}
@keyframes bounce-gentle {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* Stone Star Rating Display */
.stone-stars {
  margin-top: 10px;
  font-size: 0.76rem;
  letter-spacing: 2px;
}

/* Stone Preview Card Underneath */
.stone-card-preview {
  margin-top: 10px;
  background: var(--bg-surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  text-align: center;
  max-width: 220px;
  box-shadow: var(--shadow-md);
  transition: var(--transition);
}
.stone-container:hover .stone-card-preview {
  border-color: rgba(96, 165, 250, 0.4);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}
.stone-card-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stone-card-sub {
  font-size: 0.74rem;
  color: var(--text-secondary);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stone-card-meta {
  font-size: 0.7rem;
  color: #60a5fa;
  margin-top: 4px;
  font-weight: 600;
}

/* Chapter Milestone Stone */
.milestone-stone-circle {
  width: 96px;
  height: 96px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.4rem;
  background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
  border: 4px solid #fde68a;
  box-shadow: 0 9px 0 #78350f, 0 16px 30px var(--brand-amber-glow);
  color: #fff;
  position: relative;
  cursor: pointer;
  transition: var(--transition);
}
.milestone-stone-circle:hover {
  transform: translateY(-4px);
  box-shadow: 0 13px 0 #78350f, 0 20px 40px var(--brand-amber-glow);
}
.milestone-stone-circle:active {
  transform: translateY(7px);
  box-shadow: 0 2px 0 #78350f, 0 8px 16px var(--brand-amber-glow);
}
.milestone-beacon {
  position: absolute;
  top: -32px;
  background: linear-gradient(135deg, #10b981, #059669);
  color: #fff;
  font-size: 0.7rem;
  font-weight: 800;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  white-space: nowrap;
  box-shadow: 0 4px 12px var(--brand-green-glow);
}

/* ============================================
   BUSUU MICRO-LESSON RUNNER (FULL-SCREEN FLOW)
   ============================================ */
.busuu-runner {
  max-width: 720px;
  margin: 0 auto;
  min-height: 80vh;
  display: flex;
  flex-direction: column;
}

/* Runner Top Bar */
.runner-topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
  padding: 4px 0;
}
.btn-runner-close {
  width: 42px;
  height: 42px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface-elevated);
  color: var(--text-secondary);
  font-size: 1.15rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition);
  flex-shrink: 0;
}
.btn-runner-close:hover {
  background: var(--bg-card-hover);
  color: #fff;
  border-color: var(--border-medium);
}

.runner-progress-container {
  flex: 1;
  height: 12px;
  background: rgba(255,255,255,0.08);
  border-radius: var(--radius-full);
  overflow: hidden;
  position: relative;
}
.runner-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #3b82f6, #60a5fa, #34d399);
  border-radius: var(--radius-full);
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.runner-step-badge {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-muted);
  white-space: nowrap;
}
.runner-mode-toggle {
  font-size: 0.76rem;
  padding: 7px 14px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface-elevated);
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  font-weight: 600;
}
.runner-mode-toggle:hover {
  color: #fff;
  border-color: #60a5fa;
}

/* Runner Card Body */
.runner-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-lg);
  padding: 38px 34px;
  box-shadow: var(--shadow-lg);
  min-height: 480px;
  display: flex;
  flex-direction: column;
  position: relative;
  animation: slideInUp 0.3s ease;
}
@keyframes slideInUp {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Step 1: Vocab Discovery Card */
.vocab-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  flex: 1;
}
.vocab-category-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.74rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 5px 14px;
  border-radius: var(--radius-full);
  background: rgba(59,130,246,0.15);
  color: #60a5fa;
  margin-bottom: 22px;
}
.vocab-word-hero {
  font-size: 2.6rem;
  font-weight: 800;

/* Step 3: Busuu Grammar Snapshot */
.grammar-snapshot-stage {

.play-chat-audio-btn {

  font-size: 1.05rem;

}
.play-chat-audio-btn:hover { color: #60a5fa; }

/* Step 5: Sentence Builder (Word Tiles) */
.tiles-stage {
  display: flex;

}

}
.umlaut-key:hover {
  background: var(--brand-blue);

}
.mic-record-btn {
  display: inline-flex;

  gap: 8px;

  border-radius: var(--radius-full);

  border: 1px solid var(--border-subtle);
  color: #fff;
  font-weight: 600;
  font-size: 0.86rem;
  cursor: pointer;
  transition: var(--transition);
}
.mic-record-btn.recording {

/* Step 7: Celebration Screen */
.celebration-stage {

}

}

.fill-blank-stage {

}
.fill-blank-input.correct {
  border-color: #10b981;
  background: rgba(16, 185, 129, 0.12);
  color: #34d399;
}
.fill-blank-input.wrong {
  border-color: #ef4444;
  background: rgba(239, 68, 68, 0.12);
  color: #f87171;

/* Step 4b: Word Matching Pairs (Wortpaare verbinden) */
.matching-stage {
  display: flex;
  flex-direction: column;
  flex: 1;
}
.matching-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 24px;
}
.matching-card {
  background: var(--bg-surface-elevated);
  border: 2px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 16px 14px;
  font-size: 0.98rem;
  font-weight: 600;
  color: var(--text-primary);
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 4px 0 #0f172a;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}
.matching-card:hover {
  background: var(--bg-card-hover);
  border-color: #60a5fa;
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #0f172a;
}
.matching-card:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #0f172a;
}
.matching-card.selected {
  border-color: #3b82f6;
  background: rgba(59, 130, 246, 0.22);
  color: #93c5fd;
  box-shadow: 0 4px 0 #1e40af, 0 0 12px rgba(59, 130, 246, 0.4);
  transform: translateY(-2px);
}
.matching-card.matched {
  border-color: #10b981;
  background: rgba(16, 185, 129, 0.2);
  color: #34d399;
  cursor: default;
  pointer-events: none;
  box-shadow: none;
  opacity: 0.88;
}
.matching-card.wrong {
  border-color: #ef4444;
  background: rgba(239, 68, 68, 0.25);
  color: #f87171;
  animation: matchShake 0.4s ease;
}
@keyframes matchShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* Mobile Hamburger Toggle */
.mobile-toggle {
  display: none;
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 101;
  background: var(--bg-surface-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  border-radius: var(--radius-xs);
  padding: 8px 12px;
  font-size: 1.2rem;
  cursor: pointer;
}

/* Responsive adjustments */
@media (max-width: 900px) {
  .mobile-toggle { display: block; }
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-content { margin-left: 0; padding: 60px 16px 120px; }
  .stone-row.stagger-left, .stone-row.stagger-right { transform: translateX(0); }
}

/* Helper: Escape HTML string */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

}

function loadState() {

    if (raw) return { ...getDefaultState(), ...JSON.parse(raw) };
  } catch(e) {}
  return getDefaultState();
}

function saveState() {

    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {}
}

/* Sound Engine (Web Audio API) */
class SoundEngine {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playTone(freq, type, duration, delay = 0, gainLevel = 0.15) {
    if (!state.soundEnabled) return;
    try {
      this.init();
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const now = this.ctx.currentTime + delay;

      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(gainLevel, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(now);
      osc.stop(now + duration);
    } catch(e) {}
  }
  correct() {
    this.playTone(523.25, 'sine', 0.16, 0, 0.18);
    this.playTone(659.25, 'sine', 0.16, 0.08, 0.18);
    this.playTone(783.99, 'sine', 0.28, 0.16, 0.22);
  }
  wrong() {
    this.playTone(220, 'triangle', 0.2, 0, 0.2);
    this.playTone(174.61, 'triangle', 0.28, 0.1, 0.22);
  }
  click() {
    this.playTone(800, 'sine', 0.03, 0, 0.06);
  }
  fanfare() {
    this.playTone(523.25, 'sine', 0.15, 0, 0.2);
    this.playTone(659.25, 'sine', 0.15, 0.12, 0.2);
    this.playTone(783.99, 'sine', 0.2, 0.24, 0.25);
    this.playTone(1046.50, 'sine', 0.45, 0.4, 0.3);
  }
}

/* Web Speech Engine */
let deVoice = null;
function initSpeech() {
  if (!('speechSynthesis' in window)) return;
  const updateVoices = () => {
    const voices = window.speechSynthesis.getVoices();
    deVoice = voices.find(v => v.lang.startsWith('de') && (v.name.includes('Google') || v.name.includes('Katja') || v.name.includes('Stefan') || v.name.includes('Anna'))) 
              || voices.find(v => v.lang.startsWith('de')) || null;
  };
  updateVoices();
  if (window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = updateVoices;
  }
}
initSpeech();

function speakGerman(text, rate = 1.0) {
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/<[^>]*>/g, '').trim();
  if (!clean) return;

  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = 'de-DE';
  utter.rate = rate;
  if (deVoice) utter.voice = deVoice;
  window.speechSynthesis.speak(utter);
}

function playAudio(text, rate = 1.0) {
  speakGerman(text, rate);
}

function updateStreak() {
  const today = new Date().toISOString().split('T')[0];
  if (state.lastActiveDate !== today) {
    const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
    if (state.lastActiveDate === yesterday) {
      state.streak += 1;
    } else {
      state.streak = 1;
    }
    state.lastActiveDate = today;
    saveState();
  }
  updateXpDisplay();
}

      const isActive = nextLesson && nextLesson.id === lesson.id;
      const stars = getLessonStars(lesson.id);
      const stagger = staggerClasses[lIdx % staggerClasses.length];

      let stateClass = 'locked';
      let centerIcon = '🔒';
      if (completed) {
        stateClass = 'completed';
        centerIcon = '✓';
      } else if (unlocked) {
        stateClass = isActive ? 'active' : 'unlocked';
        centerIcon = isActive ? '▶' : lesson.icon;
      }

      html += `
        <div class="stone-row ${stagger}">
          <div class="stone-container" onclick="handleStoneClick(${lesson.id})">
            ${isActive ? `<div class="start-here-beacon">🚀 START HIER</div>` : ''}
            
            <div class="stone-circle ${stateClass}" title="${escapeHtml(lesson.titleDe)}">
              ${centerIcon}
            </div>

            ${completed ? `
              <div class="stone-stars">${'⭐'.repeat(stars || 3)}</div>
            ` : ''}

            <div class="stone-card-preview">
              <div class="stone-card-title">${lesson.id}. ${escapeHtml(lesson.titleDe)}</div>
              <div class="stone-card-sub">${escapeHtml(lesson.title)}</div>
              <div class="stone-card-meta">⏱️ 4–5 Min. • Wortschatz & Dialog</div>
            </div>
          </div>
        </div>
      `;
    });

    // Chapter Milestone Checkpoint Stone at end of chapter
    const allModDone = modCompleted === modLessons.length;
    html += `
          <!-- Chapter Milestone Checkpoint -->
          <div class="stone-row stagger-center" style="margin-top:16px">
            <div class="stone-container" onclick="openChapterMilestone(${mod.id})">
              <div class="milestone-beacon">🏆 MEILENSTEIN</div>
              <div class="milestone-stone-circle" title="Kapitel-Abschlussprüfung">
                ${allModDone ? '👑' : '🏆'}
              </div>
              <div class="stone-card-preview" style="border-color:var(--brand-amber)">
                <div class="stone-card-title">Kapitel ${mod.id} Goethe-Check</div>
                <div class="stone-card-sub">Zusammenfassender Abschlusstest</div>
                <div class="stone-card-meta" style="color:#fbbf24">🏅 +50 XP Bonus</div>
              </div>
            </div>
          </div>

        </div><!-- /.path-track -->
      </div><!-- /.timeline-chapter -->
    `;
  });

  html += `</div><!-- /.busuu-timeline -->`;

  document.getElementById('main-content').innerHTML = html;
  renderSidebarChapters(levelModules);
}

function handleStoneClick(lessonId) {
  if (isLessonUnlocked(lessonId)) {
    startLessonFlow(lessonId);
  } else {
    showProfToast('🔒 Diese Lektion ist noch gesperrt. Schließe die vorherigen Lektionen ab oder aktiviere "Alle freigeschaltet"!');
  }
}

function openChapterMilestone(moduleId) {
  const mod = MODULES.find(m => m.id === moduleId);
  if (!mod) return;
  const firstLessonId = mod.lessons[0];
  startLessonFlow(firstLessonId);
}

/* Sidebar Chapter Quick Jump */
function renderSidebarChapters(modules) {
  const container = document.getElementById('sidebar-chapters');
  if (!container) return;
  container.innerHTML = `
    <div style="font-size:0.75rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px">Kapitel im Überblick:</div>

function scrollToChapter(chapterId) {
  const el = document.getElementById(`chapter-${chapterId}`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ============================================
   BUSUU MICRO-LESSON RUNNER (CARD-BY-CARD FLOW)
   ============================================ */
let runnerState = {
  lesson: null,
  steps: [],
  currentStepIndex: 0,
  score: 0,
  viewMode: 'flow' // 'flow' | 'reference'
};

function startLessonFlow(lessonId) {
  const lesson = LESSONS.find(l => l.id === lessonId);
  if (!lesson) return;
  if (!isLessonUnlocked(lessonId)) return;

  state.currentLesson = lessonId;
  saveState();
  soundEngine.click();

  const vocabItems = extractVocabItems(lesson);
  const grammarSection = (lesson.lectureContent || []).find(s => s.type === 'grammar');
  const dialogueLines = lesson.dialogue || [];
  const exercises = lesson.exercises || [];

  const steps = [];

  // Step 1: Vocab Discovery (Target word 1)
  const v1 = vocabItems[0] || { de: lesson.titleDe, en: lesson.title, ex: 'Ich lerne Deutsch in Berlin.', exEn: 'I learn German in Berlin.' };
  steps.push({
    type: 'vocab_intro',
    title: 'Neues Wort entdecken',
    word: v1.de,
    gender: guessGender(v1.de),
    meaning: v1.en,
    example: v1.ex,
    exampleEn: v1.exEn || 'Example in context',
    spanishTip: getSpanishTip(lesson)
  });

  // Step 2: Immediate Recall Micro-Drill
  const recallOptions = buildRecallOptions(v1, vocabItems);
  steps.push({
    type: 'micro_drill',
    instruction: 'Wähle die richtige Bedeutung:',
    prompt: v1.de,
    options: recallOptions.options,
    correctIndex: recallOptions.correctIndex,
    explanation: `${v1.de} bedeutet auf Englisch ${v1.en}.`,
    answered: false,
    chosenIdx: null
  });

  // Step 3: Interactive Fill-in-the-Blank (Lückentext)
  const fillEx = exercises.find(e => e.type === 'fill_blank');
  if (fillEx && fillEx.sentence && fillEx.answer) {
    steps.push({
      type: 'fill_blank',
      title: 'Lückentext-Meister',
      instruction: fillEx.instruction || 'Ergänze das fehlende deutsche Wort:',
      sentence: fillEx.sentence,
      answer: fillEx.answer,
      hint: fillEx.hint || '',
      answered: false,
      userAnswer: ''
    });
  }

  // Step 4: Busuu Grammar Snapshot
  if (grammarSection) {
    steps.push({
      type: 'grammar_snapshot',
      title: 'Busuu Grammatik-Tipp',
      sectionTitle: grammarSection.sectionTitle,
      htmlContent: grammarSection.content,
      lessonId: lesson.id
    });
  }

  // Step 5: Interactive Word Matching Pairs (Wortpaare verbinden)
  const matchingEx = exercises.find(e => e.type === 'matching');
  if (matchingEx && matchingEx.pairs && matchingEx.pairs.length > 0) {
    const rawPairs = matchingEx.pairs.slice(0, 4).map(p => ({
      de: Array.isArray(p) ? p[0] : p.de,
      en: Array.isArray(p) ? p[1] : p.en
    }));
    steps.push({
      type: 'matching_pairs',
      title: 'Wortpaare verbinden',
      instruction: matchingEx.instruction || 'Tippe auf das deutsche Wort und die passende Bedeutung:',
      pairs: rawPairs,
      leftItems: rawPairs.map((p, i) => ({ id: i, text: p.de })).sort(() => Math.random() - 0.5),
      rightItems: rawPairs.map((p, i) => ({ id: i, text: p.en })).sort(() => Math.random() - 0.5),
      matchedIds: [],
      selectedLeft: null,
      selectedRight: null
    });
  }

  // Step 6: Native Dialogue in Action
  if (dialogueLines.length > 0) {
    steps.push({
      type: 'dialogue',
      title: 'Echtes Gespräch in Berlin',
      dialogue: dialogueLines
    });
  }

  // Step 5: Sentence Builder (Word Tiles)
  const reorderEx = exercises.find(e => e.type === 'reorder') || {
    answer: v1.ex || `${v1.de} ist wichtig für mich.`
  };
  const rawSentence = reorderEx.answer || 'Ich lerne Deutsch.';
  const rawTokens = rawSentence.replace(/[.!?]/g, '').trim().split(/\s+/);
  steps.push({
    type: 'sentence_builder',
    title: 'Satzbau-Meister',
    targetSentence: rawSentence,
    shuffledTokens: [...rawTokens].sort(() => Math.random() - 0.5),
    dropTokens: []
  });

  // Step 6: Active Production (Speaking / Writing with Herr Professor)
  steps.push({
    type: 'active_production',
    title: 'Jetzt bist du dran: Sprich oder schreibe!',
    prompt: lesson.goetheWriting?.situation || `Schreibe oder sprich 1–2 Sätze über das Thema "${lesson.titleDe}".`,
    points: lesson.goetheWriting?.points || ['Beschreibe kurz deine Situation.', 'Nutze weil oder deshalb.'],
    modelAnswer: lesson.goetheWriting?.modelAnswer || 'Hallo! Ich bin in Berlin und lerne Deutsch.'
  });

  // Step 7: Celebration Screen
  steps.push({
    type: 'celebration',
    title: 'Lektion abgeschlossen!',
    lessonId: lesson.id
  });

  runnerState = {
    lesson: lesson,
    steps: steps,
    currentStepIndex: 0,
    score: 0,
    viewMode: 'flow'
  };

  renderRunner();
}

function renderRunner() {
  const { lesson, steps, currentStepIndex, viewMode } = runnerState;
  const currentStep = steps[currentStepIndex];
  const progressPct = Math.round(((currentStepIndex) / (steps.length - 1)) * 100);

  let html = `
    <div class="busuu-runner">
      <!-- Runner Top Bar -->
      <div class="runner-topbar">
        <button class="btn-runner-close" onclick="showDashboard()" title="Zurück zum Lernpfad">✕</button>
        
        <div class="runner-progress-container" title="Fortschritt">
          <div class="runner-progress-fill" style="width:${progressPct}%"></div>
        </div>

        <div class="runner-step-badge">
          Schritt ${currentStepIndex + 1} von ${steps.length}
        </div>

        <button class="runner-mode-toggle" onclick="toggleRunnerViewMode()">
          ${viewMode === 'flow' ? '📖 Alle Inhalte (Referenz)' : '⚡ Busuu Flow'}
        </button>
      </div>
  `;

  if (viewMode === 'reference') {
    html += renderReferenceView(lesson);
  } else {
    html += `
      <div class="runner-card" id="runner-card-content">
        ${renderRunnerStepContent(currentStep, currentStepIndex)}
      </div>
    `;
  }

  html += `</div>`;
  document.getElementById('main-content').innerHTML = html;

  // Auto-play audio on Step 1 (Vocab) if sound enabled
  if (currentStep.type === 'vocab_intro' && state.soundEnabled) {
    setTimeout(() => speakGerman(currentStep.word), 400);
  }

  // Trigger celebration effects on final step
  if (currentStep.type === 'celebration') {
    onLessonCompleted(lesson.id);
  }
}

function toggleRunnerViewMode() {
  runnerState.viewMode = runnerState.viewMode === 'flow' ? 'reference' : 'flow';
  renderRunner();
}

  const step = runnerState.steps[runnerState.currentStepIndex];

  const inp = document.getElementById('fill-blank-input');

    soundEngine.correct();

            <div class="feedback-text-title">Fast richtig!</div>

function updateMatchingUI() {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || step.type !== 'matching_pairs') return;

  step.leftItems.forEach(item => {
    const el = document.getElementById(`match-left-${item.id}`);
    if (!el) return;
    el.className = 'matching-card';
    if (step.matchedIds.includes(item.id)) {
      el.classList.add('matched');
      el.innerHTML = `✓ ${escapeHtml(item.text)}`;
    } else if (step.selectedLeft === item.id) {
      el.classList.add('selected');
      el.innerHTML = escapeHtml(item.text);
    } else {
      el.innerHTML = escapeHtml(item.text);
    }
  });

  step.rightItems.forEach(item => {
    const el = document.getElementById(`match-right-${item.id}`);
    if (!el) return;
    el.className = 'matching-card';
    if (step.matchedIds.includes(item.id)) {
      el.classList.add('matched');
      el.innerHTML = `✓ ${escapeHtml(item.text)}`;
    } else if (step.selectedRight === item.id) {
      el.classList.add('selected');
      el.innerHTML = escapeHtml(item.text);
    } else {
      el.innerHTML = escapeHtml(item.text);
    }
  });
}

function handleMatchCardClick(side, id) {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || step.type !== 'matching_pairs') return;
  if (step.matchedIds.includes(id)) return;

  soundEngine.click();

  if (side === 'left') {
    step.selectedLeft = id;
    if (step.pairs[id]) {
      speakGerman(step.pairs[id].de);
    }
  } else {
    step.selectedRight = id;
  }

  updateMatchingUI();

  // If both left and right are selected, evaluate match
  if (step.selectedLeft !== null && step.selectedRight !== null) {
    const leftId = step.selectedLeft;
    const rightId = step.selectedRight;

    if (leftId === rightId) {
      // Match!
      soundEngine.correct();
      addXp(5);
      step.matchedIds.push(leftId);
      step.selectedLeft = null;
      step.selectedRight = null;
      updateMatchingUI();

      if (step.matchedIds.length === step.pairs.length) {
        soundEngine.fanfare();
        addXp(10);
        const container = document.getElementById('matching-feedback-container');
        if (container) {
          container.innerHTML = `
            <div class="runner-feedback-sheet correct" style="margin-top:16px">
              <div>
                <div class="feedback-text-title">🎉 Alle Wortpaare verbunden!</div>
                <div class="feedback-text-desc">Großartige Arbeit, Guillermo! Alle Paare gemeistert.</div>
              </div>
              <button class="btn-primary" id="btn-feedback-next" style="padding:10px 22px" onclick="nextRunnerStep()">
                Weiter →
              </button>
            </div>
          `;
          setTimeout(() => document.getElementById('btn-feedback-next')?.focus(), 100);
        }
      }
    } else {
      // Mismatch
      soundEngine.wrong();
      const elLeft = document.getElementById(`match-left-${leftId}`);
      const elRight = document.getElementById(`match-right-${rightId}`);
      if (elLeft) elLeft.classList.add('wrong');
      if (elRight) elRight.classList.add('wrong');

      setTimeout(() => {
        step.selectedLeft = null;
        step.selectedRight = null;
        updateMatchingUI();
      }, 500);
    }
  }
}

let runnerRecognition = null;
function toggleRunnerMic() {
  const btn = document.getElementById('btn-runner-mic');
  const tx = document.getElementById('runner-production-text');
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRec) {
    alert('Spracherkennung wird von diesem Browser nicht nativ unterstützt. Bitte verwende Chrome oder Edge!');
    return;
  }

  if (runnerRecognition) {
    runnerRecognition.stop();
    runnerRecognition = null;
    if (btn) btn.classList.remove('recording');
    return;
  }

  runnerRecognition = new SpeechRec();
  runnerRecognition.lang = 'de-DE';
  runnerRecognition.continuous = false;
  runnerRecognition.interimResults = false;

  runnerRecognition.onstart = () => {
    if (btn) btn.classList.add('recording');
    btn.innerText = '🔴 Aufnahme läuft... Sprich jetzt!';
  };

  runnerRecognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    if (tx) tx.value += (tx.value ? ' ' : '') + transcript;
  };

  runnerRecognition.onerror = () => {
    if (btn) {
      btn.classList.remove('recording');
      btn.innerText = '🎤 Spracheingabe';
    }
  };

  runnerRecognition.onend = () => {
    if (btn) {
      btn.classList.remove('recording');
      btn.innerText = '🎤 Spracheingabe';
    }
    runnerRecognition = null;
  };

  runnerRecognition.start();
}

/* Confetti Particle System */
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  if (!canvas || typeof canvas.getContext !== 'function') return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;

  const pieces = [];
  const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#fbbf24'];

  for (let i = 0; i < 70; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      speedY: Math.random() * 4 + 2,
      speedX: (Math.random() - 0.5) * 3,
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 8
    });
  }

  let animationFrame;
  let elapsed = 0;

  function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.y += p.speedY;
      p.x += p.speedX;
      p.rotation += p.rotationSpeed;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    });

    elapsed++;
    if (elapsed < 140) {
      animationFrame = requestAnimationFrame(update);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  update();
}

/* Global Keyboard Interaction */
document.addEventListener('keydown', (e) => {
  // Ignore typing inside inputs/textareas
  if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;

  if (runnerState.lesson && runnerState.viewMode === 'flow') {
    const step = runnerState.steps[runnerState.currentStepIndex];
    if (!step) return;

    // Enter key: next or check
    if (e.key === 'Enter') {
      e.preventDefault();
      if (step.type === 'micro_drill') {
        if (step.answered) nextRunnerStep();
      } else if (step.type === 'sentence_builder') {
        const btn = document.getElementById('btn-check-tiles');
        if (btn && btn.innerText.includes('Weiter')) nextRunnerStep();
        else checkSentenceTiles();
      } else if (step.type === 'celebration') {
        finishLessonAndGoNext();
      } else {
        nextRunnerStep();
      }
      return;
    }

    // Space key: replay audio on vocab or drill prompt
    if (e.key === ' ') {
      e.preventDefault();
      if (step.type === 'vocab_intro') speakCurrentStepWord();
      else if (step.type === 'micro_drill') speakCurrentStepPrompt();
      return;
    }

    // Number keys 1-4 or A-D for micro-drill options
    if (step.type === 'micro_drill' && !step.answered) {
      if (['1', '2', '3', '4'].includes(e.key)) {
        e.preventDefault();
        handleDrillAnswer(parseInt(e.key) - 1);
      } else if (['a', 'b', 'c', 'd'].includes(e.key.toLowerCase())) {
        e.preventDefault();
        const map = { a: 0, b: 1, c: 2, d: 3 };
        handleDrillAnswer(map[e.key.toLowerCase()]);
      }
    }
  }
});

/* Helpers to Extract Vocab and Build Recalls */
function extractVocabItems(lesson) {
  const items = [];
  (lesson.lectureContent || []).forEach(sec => {
    if (sec.type === 'vocabulary') {
      const rowMatches = sec.content.matchAll(/<tr>\s*<td>(<strong>)?([^<]+)(<\/strong>)?<\/td>\s*<td>([^<]+)<\/td>\s*<td>([^<]*)<\/td>/gi);
      for (const m of rowMatches) {
        items.push({
          de: m[2].trim(),
          en: m[4].trim(),
          ex: m[5].trim() || 'Ich mag das sehr.'
        });
      }
    }
  });
  return items;
}

function guessGender(deWord) {
  const lower = deWord.toLowerCase();
  if (lower.startsWith('der ') || lower.includes('(der)')) return 'der';
  if (lower.startsWith('die ') || lower.includes('(die)')) return 'die';
  if (lower.startsWith('das ') || lower.includes('(das)')) return 'das';
  return 'other';
}

function buildRecallOptions(correctItem, allItems) {
  const distractors = allItems
    .filter(it => it.en !== correctItem.en)
    .map(it => it.en);
  
  const fallbacks = ['to arrive', 'friendly', 'happy', 'busy', 'because of', 'together'];
  while (distractors.length < 3) {
    distractors.push(fallbacks.pop());
  }

  const chosenDistractors = distractors.sort(() => Math.random() - 0.5).slice(0, 3);
  const options = [...chosenDistractors, correctItem.en].sort(() => Math.random() - 0.5);
  const correctIndex = options.indexOf(correctItem.en);

  return { options, correctIndex };
}
