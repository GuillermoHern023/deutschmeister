      </div>
    `;
  }

  if (step.type === 'grammar_snapshot') {
    return `
      <div class="grammar-snapshot-stage">
        <div class="vocab-category-tag" style="background:var(--pastel-amber-bg);color:var(--pastel-amber-text);border-color:var(--pastel-amber-border)">
          📖 ${escapeHtml(step.title)}
        </div>
        
        <div class="grammar-hero-card">
          <h3 style="color:var(--pastel-amber-text);margin-bottom:12px">${escapeHtml(step.sectionTitle)}</h3>
          <div class="grammar-rule-summary">
            ${step.htmlContent}
          </div>
        </div>

        <div class="spanish-helper-box">
          <div class="spanish-helper-header">💡 Satzbau- & Lese-Geheimnis</div>
          <div class="spanish-helper-text">
            Im Deutschen bildet der Satz eine <strong>Klammer</strong>: Im Hauptsatz steht das konjugierte Verb an <strong>Position 2</strong> und das zweite Verbteil (Infinitiv, Partizip, Präfix) ganz am <strong>Satzende</strong>. Beim Lesen komplexer Sätze lohnt sich immer ein kurzer Blick ans Satzende!
          </div>
        </div>

        <button class="btn-primary" style="width:100%;margin-top:auto" onclick="nextRunnerStep()">
          Verstanden! Weiter zum Lesetext →
        </button>
      </div>
    `;
  }

  if (step.type === 'dialogue') {
    return `
      <div class="dialogue-stage">
        <div class="vocab-category-tag" style="background:var(--pastel-mint-bg);color:var(--pastel-mint-text);border-color:var(--pastel-mint-border)">
          🎧 ${escapeHtml(step.title)}
        </div>

        <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
          <button class="btn-secondary" style="font-size:0.8rem;padding:6px 14px" onclick="playAllDialogue()">
            ▶ Gespräch ganz abspielen
          </button>
        </div>

        <div class="dialogue-chat-box">
          ${step.dialogue.map((line, dIdx) => {
            const isRight = dIdx % 2 !== 0;
            return `
              <div class="chat-msg-row ${isRight ? 'right' : 'left'}">
                <div class="chat-avatar">${isRight ? '🧑‍💼' : '🙋‍♂️'}</div>
                <div class="chat-bubble">
                  <div class="chat-speaker">${escapeHtml(line.speaker || (isRight ? 'Guillermo' : 'Lukas'))}</div>
                  <div class="chat-text-de">
                    ${escapeHtml(line.de)}
                    <button class="play-chat-audio-btn" onclick="speakDialogueLine(${dIdx})" title="Anhören">🔊</button>
                  </div>
                  <div class="chat-text-en">${escapeHtml(line.en)}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <button class="btn-primary" style="width:100%;margin-top:auto" onclick="nextRunnerStep()">
          Weiter zur Übung →
        </button>
      </div>
    `;
  }

  if (step.type === 'sentence_builder') {
    return `
      <div class="tiles-stage">
        <div class="vocab-category-tag" style="background:var(--pastel-lavender-bg);color:var(--pastel-lavender-text);border-color:var(--pastel-lavender-border)">
          ⚡ ${escapeHtml(step.title)}
        </div>

        <div style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:12px">
          Tippe auf die Wörter in der richtigen Reihenfolge, um den deutschen Satz zu bilden:
        </div>

        <div class="tiles-drop-area" id="tiles-dropzone" onclick="removeLastTile()">
          <span style="color:var(--text-muted);font-size:0.85rem" id="dropzone-hint">Wähle Wörter unten aus...</span>
        </div>

        <div class="tiles-bank" id="tiles-bank">
          ${step.shuffledTokens.map((word, wIdx) => `
            <div class="tile-chip" id="tile-${wIdx}" onclick="handleTileClick(${wIdx})">
              ${escapeHtml(word)}
            </div>
          `).join('')}
        </div>

        <div id="tile-feedback-box"></div>

        <button class="btn-primary" id="btn-check-tiles" style="width:100%;margin-top:auto" onclick="checkSentenceTiles()">
          Satz überprüfen ✓
        </button>
      </div>

  if (step.type === 'active_production') {
    return `
      <div class="production-stage">
        <div class="vocab-category-tag" style="background:var(--pastel-amber-bg);color:var(--pastel-amber-text);border-color:var(--pastel-amber-border)">

        </div>

          <div class="production-prompt-title">${escapeHtml(step.title)}</div>
          <div class="production-prompt-sub">${escapeHtml(step.prompt)}</div>
          <ul style="margin:10px 0 0 20px;font-size:0.82rem;color:var(--text-secondary)">
            ${step.points.map(p => `<li>${escapeHtml(p)}</li>`).join('')}
          </ul>
        </div>

        <div class="umlaut-bar">
          <button type="button" class="umlaut-key" onclick="insertRunnerUmlaut('ä')">ä</button>
          <button type="button" class="umlaut-key" onclick="insertRunnerUmlaut('ö')">ö</button>
          <button type="button" class="umlaut-key" onclick="insertRunnerUmlaut('ü')">ü</button>
          <button type="button" class="umlaut-key" onclick="insertRunnerUmlaut('ß')">ß</button>
          <button type="button" class="mic-record-btn" id="btn-runner-mic" onclick="toggleRunnerMic()">
            🎤 Spracheingabe
          </button>
        </div>

        <textarea id="runner-production-text" class="production-textarea" placeholder="Schreibe deinen deutschen Satz hier... (z.B. Ich lerne Deutsch, weil...)"></textarea>

        <div style="display:flex;gap:10px;margin-bottom:14px">
          <button class="btn-secondary" style="flex:1" onclick="gradeRunnerWithProfessor()">
            👨‍🏫 Satzbau prüfen lassen
          </button>
          <button class="btn-secondary" style="font-size:0.8rem" onclick="toggleRunnerModelAnswer()">
            💡 Musterlösung
          </button>
        </div>

        <div id="runner-prof-feedback" style="display:none;margin-bottom:16px"></div>

          Weiter zum Abschluss →
        </button>
      </div>

  }

  if (step.type === 'celebration') {
    return `
      <div class="celebration-stage">
        <canvas id="confetti-canvas"></canvas>
        <div class="celebration-trophy">🏆</div>
        <div class="celebration-title">Ausgezeichnet, Guillermo!</div>
        <div class="celebration-sub">Du hast Lektion ${step.lessonId} erfolgreich gemeistert!</div>

        <div class="celebration-stats-grid">
          <div class="celebration-stat-card">
            <div class="celebration-stat-value">+30</div>
            <div class="celebration-stat-label">XP verdient</div>
          </div>
          <div class="celebration-stat-card">
            <div class="celebration-stat-value">⭐⭐⭐</div>
            <div class="celebration-stat-label">3 Sterne</div>
          </div>
          <div class="celebration-stat-card">
            <div class="celebration-stat-value">${state.streak} 🔥</div>
            <div class="celebration-stat-label">Tage-Serie</div>
          </div>
        </div>

        <button class="btn-primary" style="width:100%;max-width:380px" onclick="finishLessonAndGoNext()">
          Nächste Lektion auf dem Lernpfad →
        </button>
      </div>
    `;
  }

  return `<div>Schritt wird geladen...</div>`;
}

function speakReadingText(rate = 1.0) {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (step && step.text) speakGerman(step.text, rate);
}

function speakGlossaryItem(gIdx) {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (step && step.glossary && step.glossary[gIdx]) {
    speakGerman(step.glossary[gIdx].de.split('(')[0].split('/')[0]);
  }
}

function handleReadingAnswer(chosenIdx) {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || step.type !== 'reading_comprehension') return;
  if (step.answered) return;

  step.answered = true;
  step.chosenIdx = chosenIdx;

  const isCorrect = chosenIdx === step.correctIndex;
  const container = document.getElementById('reading-feedback-container');
  const btn = document.getElementById(`reading-opt-${chosenIdx}`);

  document.querySelectorAll('#reading-options .drill-option-btn').forEach(b => b.style.pointerEvents = 'none');

  if (isCorrect) {
    soundEngine.correct();
    if (btn) btn.classList.add('selected-correct');
    addXp(10);
    if (container) {
      container.innerHTML = `
        <div class="runner-feedback-sheet correct">
          <div>
            <div class="feedback-text-title">✓ Text richtig verstanden!</div>
            <div class="feedback-text-desc">Starkes Leseverständnis! +10 XP</div>
          </div>
          <button class="btn-primary" id="btn-feedback-next" style="padding:10px 22px" onclick="nextRunnerStep()">
            Weiter →
          </button>
        </div>
      `;
    }
  } else {
    soundEngine.wrong();
    if (btn) btn.classList.add('selected-wrong');
    const correctBtn = document.getElementById(`reading-opt-${step.correctIndex}`);
    if (correctBtn) correctBtn.classList.add('selected-correct');
    if (container) {
      container.innerHTML = `
        <div class="runner-feedback-sheet wrong">
          <div>
            <div class="feedback-text-title">Fast richtig!</div>
            <div class="feedback-text-desc">Richtige Antwort: <strong>${escapeHtml(step.options[step.correctIndex])}</strong></div>
          </div>
          <button class="btn-secondary" id="btn-feedback-next" style="padding:10px 22px" onclick="nextRunnerStep()">
            Weiter →
          </button>
        </div>
      `;
    }
  }
  setTimeout(() => document.getElementById('btn-feedback-next')?.focus(), 100);
}

function nextRunnerStep() {
  soundEngine.click();
  if (runnerState.currentStepIndex < runnerState.steps.length - 1) {
    runnerState.currentStepIndex++;
    renderRunner();
  }
}

function insertFillBlankUmlaut(char) {
  const inp = document.getElementById('fill-blank-input');
  if (!inp) return;
  const start = inp.selectionStart;
  const end = inp.selectionEnd;
  inp.value = inp.value.substring(0, start) + char + inp.value.substring(end);
  inp.focus();
  inp.selectionStart = inp.selectionEnd = start + 1;
}

function handleFillBlankCheck() {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || step.type !== 'fill_blank') return;
  if (step.answered) return;

  const inp = document.getElementById('fill-blank-input');
  const btn = document.getElementById('btn-check-blank');
  const container = document.getElementById('fill-blank-feedback-container');
  const targetPlaceholder = document.getElementById('fill-blank-target');
  if (!inp) return;

  const val = inp.value.trim();
  if (!val) return;

  step.answered = true;
  step.userAnswer = val;

  const cleanUser = val.toLowerCase().replace(/[.,!?:;]/g, '');
  const cleanAns = step.answer.toLowerCase().replace(/[.,!?:;]/g, '');

  const isCorrect = (cleanUser === cleanAns);

  if (targetPlaceholder) {
    targetPlaceholder.innerText = step.answer;
  }

  if (isCorrect) {
    soundEngine.correct();
    addXp(10);
    inp.classList.add('correct');
    speakGerman(step.sentence.replace('___', step.answer));
    if (container) {
      container.innerHTML = `
        <div class="runner-feedback-sheet correct">
          <div>
            <div class="feedback-text-title">✓ Richtig gelöst!</div>
            <div class="feedback-text-desc">„${escapeHtml(step.sentence.replace('___', step.answer))}“</div>
          </div>
          <button class="btn-primary" id="btn-feedback-next" style="padding:10px 22px" onclick="nextRunnerStep()">
            Weiter →
          </button>
        </div>
      `;
    }
  } else {
    soundEngine.wrong();
    inp.classList.add('wrong');
    if (container) {
      container.innerHTML = `
        <div class="runner-feedback-sheet wrong">
          <div>
            <div class="feedback-text-title">Fast richtig!</div>
            <div class="feedback-text-desc">Die richtige Antwort ist: <strong>${escapeHtml(step.answer)}</strong></div>
          </div>
          <button class="btn-secondary" id="btn-feedback-next" style="padding:10px 22px" onclick="nextRunnerStep()">
            Weiter →
          </button>
        </div>
      `;
    }
  }

  if (btn) {
    btn.style.display = 'none';
  }
  inp.disabled = true;
  setTimeout(() => document.getElementById('btn-feedback-next')?.focus(), 100);
}

function updateMatchingUI() {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || step.type !== 'matching_pairs') return;

  step.leftItems.forEach(item => {
    const el = document.getElementById(`match-left-${item.id}`);
    if (!el) return;
    el.className = 'matching-card';
    if (step.matchedIds.includes(item.id)) {
      el.classList.add('matched');
      el.innerHTML = `✓ ${escapeHtml(item.text)}`;
    } else if (step.selectedLeft === item.id) {
      el.classList.add('selected');
      el.innerHTML = escapeHtml(item.text);
    } else {
      el.innerHTML = escapeHtml(item.text);
    }
  });

  step.rightItems.forEach(item => {
    const el = document.getElementById(`match-right-${item.id}`);
    if (!el) return;
    el.className = 'matching-card';
    if (step.matchedIds.includes(item.id)) {
      el.classList.add('matched');
      el.innerHTML = `✓ ${escapeHtml(item.text)}`;
    } else if (step.selectedRight === item.id) {
      el.classList.add('selected');
      el.innerHTML = escapeHtml(item.text);
    } else {
      el.innerHTML = escapeHtml(item.text);
    }
  });
}

function handleMatchCardClick(side, id) {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || step.type !== 'matching_pairs') return;
  if (step.matchedIds.includes(id)) return;

  soundEngine.click();

  if (side === 'left') {
    step.selectedLeft = id;
    if (step.pairs[id]) {
      speakGerman(step.pairs[id].de);
    }
  } else {
    step.selectedRight = id;
  }

  updateMatchingUI();

  if (step.selectedLeft !== null && step.selectedRight !== null) {
    const leftId = step.selectedLeft;
    const rightId = step.selectedRight;

    if (leftId === rightId) {
      soundEngine.correct();
      addXp(5);
      step.matchedIds.push(leftId);
      step.selectedLeft = null;
      step.selectedRight = null;
      updateMatchingUI();

      if (step.matchedIds.length === step.pairs.length) {
        soundEngine.fanfare();
        addXp(10);
        const container = document.getElementById('matching-feedback-container');
        if (container) {
          container.innerHTML = `
            <div class="runner-feedback-sheet correct" style="margin-top:16px">
              <div>
                <div class="feedback-text-title">🎉 Alle Wortpaare verbunden!</div>
                <div class="feedback-text-desc">Großartige Arbeit, Guillermo! Alle Paare gemeistert.</div>
              </div>
              <button class="btn-primary" id="btn-feedback-next" style="padding:10px 22px" onclick="nextRunnerStep()">
                Weiter →
              </button>
            </div>
          `;
          setTimeout(() => document.getElementById('btn-feedback-next')?.focus(), 100);
        }
      }
    } else {
      soundEngine.wrong();
      const elLeft = document.getElementById(`match-left-${leftId}`);
      const elRight = document.getElementById(`match-right-${rightId}`);
      if (elLeft) elLeft.classList.add('wrong');
      if (elRight) elRight.classList.add('wrong');

      setTimeout(() => {
        step.selectedLeft = null;
        step.selectedRight = null;
        updateMatchingUI();
      }, 500);
    }
  }
}

function handleDrillAnswer(chosenIdx) {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || step.type !== 'micro_drill') return;
  if (step.answered) return;

  step.answered = true;
  step.chosenIdx = chosenIdx;

  const isCorrect = chosenIdx === step.correctIndex;
  const container = document.getElementById('drill-feedback-container');
  const btn = document.getElementById(`drill-opt-${chosenIdx}`);

  document.querySelectorAll('#drill-options .drill-option-btn').forEach(b => b.style.pointerEvents = 'none');

  if (isCorrect) {
    soundEngine.correct();
    if (btn) btn.classList.add('selected-correct');
    addXp(5);
    if (container) {
      container.innerHTML = `
        <div class="runner-feedback-sheet correct">
          <div>
            <div class="feedback-text-title">✓ Ausgezeichnet!</div>
            <div class="feedback-text-desc">${escapeHtml(step.explanation)}</div>
          </div>
          <button class="btn-primary" id="btn-feedback-next" style="padding:10px 22px" onclick="nextRunnerStep()">
            Weiter →
          </button>
        </div>
      `;
    }
  } else {
    soundEngine.wrong();
    if (btn) btn.classList.add('selected-wrong');
    const correctBtn = document.getElementById(`drill-opt-${step.correctIndex}`);
    if (correctBtn) correctBtn.classList.add('selected-correct');

    if (container) {
      container.innerHTML = `
        <div class="runner-feedback-sheet wrong">
          <div>
            <div class="feedback-text-title">Fast richtig!</div>
            <div class="feedback-text-desc">${escapeHtml(step.explanation)}</div>
          </div>
          <button class="btn-secondary" id="btn-feedback-next" style="padding:10px 22px" onclick="nextRunnerStep()">
            Weiter →
          </button>
        </div>
      `;
    }
  }

  setTimeout(() => document.getElementById('btn-feedback-next')?.focus(), 100);
}

function handleTileClick(wIdx) {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || step.type !== 'sentence_builder') return;
  const word = step.shuffledTokens[wIdx];
  soundEngine.click();

  const tileEl = document.getElementById(`tile-${wIdx}`);
  if (tileEl) tileEl.classList.add('disabled');

  step.dropTokens.push({ word, wIdx });
  renderDropTokens();
}

function removeLastTile() {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || !step.dropTokens || step.dropTokens.length === 0) return;
  const last = step.dropTokens.pop();
  const tileEl = document.getElementById(`tile-${last.wIdx}`);
  if (tileEl) tileEl.classList.remove('disabled');
  renderDropTokens();
}

function renderDropTokens() {
  const step = runnerState.steps[runnerState.currentStepIndex];
  const dropzone = document.getElementById('tiles-dropzone');
  if (!dropzone || !step) return;

  if (!step.dropTokens || step.dropTokens.length === 0) {
    dropzone.innerHTML = `<span style="color:var(--text-muted);font-size:0.85rem">Wähle Wörter unten aus...</span>`;
    dropzone.classList.remove('filled');
    return;
  }

  dropzone.classList.add('filled');
  dropzone.innerHTML = step.dropTokens.map(item => `
    <div class="tile-chip in-drop">${escapeHtml(item.word)}</div>
  `).join('');
}

function checkSentenceTiles() {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || step.type !== 'sentence_builder') return;

  const assembled = (step.dropTokens || []).map(t => t.word).join(' ').trim();
  const cleanTarget = step.targetSentence.replace(/[.!?]/g, '').trim();
  const box = document.getElementById('tile-feedback-box');
  const btn = document.getElementById('btn-check-tiles');

  if (assembled.toLowerCase() === cleanTarget.toLowerCase()) {
    soundEngine.correct();
    speakGerman(step.targetSentence);
    addXp(10);
    if (box) {
      box.innerHTML = `
        <div class="runner-feedback-sheet correct" style="margin-bottom:16px">
          <div>
            <div class="feedback-text-title">✓ Perfekt zusammengesetzt!</div>
            <div class="feedback-text-desc">„${escapeHtml(step.targetSentence)}“</div>
          </div>
        </div>
      `;
    }
    if (btn) {
      btn.innerText = 'Weiter →';
      btn.onclick = nextRunnerStep;
      btn.focus();
    }
  } else {
    soundEngine.wrong();
    if (box) {
      box.innerHTML = `
        <div class="runner-feedback-sheet wrong" style="margin-bottom:16px">
          <div>
            <div class="feedback-text-title">Nicht ganz richtig</div>
            <div class="feedback-text-desc">Richtige Reihenfolge: <strong>${escapeHtml(step.targetSentence)}</strong></div>
          </div>
        </div>
      `;
    }
    if (btn) {
      btn.innerText = 'Weiter →';
      btn.onclick = nextRunnerStep;
      btn.focus();
    }
  }
}

function insertRunnerUmlaut(char) {
  const tx = document.getElementById('runner-production-text');
  if (!tx) return;
  const start = tx.selectionStart;
  const end = tx.selectionEnd;
  tx.value = tx.value.substring(0, start) + char + tx.value.substring(end);
  tx.focus();
  tx.selectionStart = tx.selectionEnd = start + 1;
}

let runnerRecognition = null;
function toggleRunnerMic() {
  const btn = document.getElementById('btn-runner-mic');
  const tx = document.getElementById('runner-production-text');
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRec) {
    showToast('🎙️ Spracherkennung wird in Chrome und Edge unterstützt.');
    return;
  }

  if (runnerRecognition) {
    runnerRecognition.stop();
    runnerRecognition = null;
    if (btn) btn.classList.remove('recording');
    return;
  }

  runnerRecognition = new SpeechRec();
  runnerRecognition.lang = 'de-DE';
  runnerRecognition.continuous = false;
  runnerRecognition.interimResults = false;

  runnerRecognition.onstart = () => {
    if (btn) btn.classList.add('recording');
    btn.innerText = '🔴 Aufnahme läuft... Sprich jetzt!';
  };

  runnerRecognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    if (tx) tx.value += (tx.value ? ' ' : '') + transcript;
  };

  runnerRecognition.onerror = () => {
    if (btn) {
      btn.classList.remove('recording');
      btn.innerText = '🎤 Spracheingabe';
    }
  };

  runnerRecognition.onend = () => {
    if (btn) {
      btn.classList.remove('recording');
      btn.innerText = '🎤 Spracheingabe';
    }
    runnerRecognition = null;
  };

  runnerRecognition.start();
}

function gradeRunnerWithProfessor() {
  const text = (document.getElementById('runner-production-text')?.value || '').trim();
  const box = document.getElementById('runner-prof-feedback');
  if (!box) return;

  if (!text) {
    showToast('✍️ Bitte schreibe zuerst einen Satz auf Deutsch oder nutze das Mikrofon!');
    return;
  }

  box.style.display = 'block';
  box.innerHTML = `<div style="color:var(--pastel-amber-text);padding:12px;text-align:center;font-weight:700">👨‍🏫 Dein Satzbau wird analysiert...</div>`;

  setTimeout(() => {
    let corrections = [];
    if (/weil\s+([a-zäöü]+)\s+(bin|habe|ist|kann|muss|wohne|arbeite)/i.test(text)) {
      corrections.push(`⚠️ <strong>Verbstellung bei „weil“:</strong> Das konjugierte Verb wandert ans Satzende: <em>... weil ich in Berlin <strong>arbeite</strong></em>.`);
    }
    if (/obwohl\s+([a-zäöü]+)\s+(bin|habe|ist|kann|muss)/i.test(text)) {
      corrections.push(`⚠️ <strong>Verbstellung bei „obwohl“:</strong> Auch hier gehört das Verb ans Satzende!`);
    }
    if (/getrinkt/i.test(text)) {
      corrections.push(`⚠️ <strong>Partizip II von trinken:</strong> Das Partizip heißt <strong>getrunken</strong> (nicht „getrinkt“).`);
    }
    if (/^(gestern|heute|morgen)\s+ich\s+/i.test(text)) {
      corrections.push(`⚠️ <strong>Verbposition 2 (Inversion):</strong> Nach einer Zeitangabe am Anfang folgt sofort das Verb: <em>Gestern <strong>habe</strong> ich... / Morgen <strong>arbeite</strong> ich...</em>`);
    }

    let html = `
      <div class="spanish-helper-box" style="margin-bottom:0">
        <div class="spanish-helper-header">👨‍🏫 Satzbau-Feedback:</div>
        <div class="spanish-helper-text" style="color:var(--text-primary)">
          ${corrections.length > 0 ? corrections.join('<br>') : '✅ <strong>Sehr gut gemacht!</strong> Dein Satzbau und die Verbstellung sehen sauber aus (+10 XP).'}
        </div>
      </div>
    `;
    box.innerHTML = html;
    addXp(10);
  }, 300);
}

function toggleRunnerModelAnswer() {
  const step = runnerState.steps[runnerState.currentStepIndex];

  box.style.display = 'block';

      <button class="audio-btn" style="margin-top:8px" onclick="speakRunnerModelAnswer()">🔊 Vorlesen lassen</button>

function playAllDialogue() {
  const step = runnerState.steps[runnerState.currentStepIndex];
  if (!step || !step.dialogue) return;

  let delay = 0;
  step.dialogue.forEach(line => {
    setTimeout(() => speakGerman(line.de), delay);
    delay += Math.max(2200, line.de.split(' ').length * 400);
  });
}

function onLessonCompleted(lessonId) {
  soundEngine.fanfare();
  state.completedLessons[lessonId] = {
    stars: 3,
    score: 100,
    completedAt: new Date().toISOString()
  };
  addXp(30);
  updateStreak();
  saveState();

  setTimeout(() => launchConfetti(), 200);
}

function finishLessonAndGoNext() {
  const ordered = getOrderedLessonIds();
  const curIdx = ordered.indexOf(runnerState.lesson.id);
  const nextId = curIdx !== -1 && curIdx + 1 < ordered.length ? ordered[curIdx + 1] : null;
  const nextLesson = nextId ? LESSONS.find(l => l.id === nextId) : null;

  if (nextLesson && isLessonUnlocked(nextId)) {
    const nextLevel = getLessonLevel(nextId);
    if (nextLevel !== state.activeLevel) {
      state.activeLevel = nextLevel;
      saveState();
    }
    startLessonFlow(nextId);
  } else {
    showDashboard();
  }
}

/* Confetti Particle System */
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  if (!canvas || typeof canvas.getContext !== 'function') return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;

  const pieces = [];
  const colors = ['#38bdf8', '#34d399', '#fbbf24', '#fb7185', '#c084fc', '#60a5fa'];

  for (let i = 0; i < 70; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      speedY: Math.random() * 4 + 2,
      speedX: (Math.random() - 0.5) * 3,
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 8
    });
  }

  let elapsed = 0;

  function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.y += p.speedY;
      p.x += p.speedX;
      p.rotation += p.rotationSpeed;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    });

    elapsed++;
    if (elapsed < 140) {
      requestAnimationFrame(update);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  update();
}

/* Global Keyboard Interaction */
document.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT')) return;

  if (runnerState.lesson && runnerState.viewMode === 'flow') {
    const step = runnerState.steps[runnerState.currentStepIndex];
    if (!step) return;

    if (e.key === 'Enter') {
      e.preventDefault();
      if (step.type === 'micro_drill' || step.type === 'reading_comprehension') {
        if (step.answered) nextRunnerStep();
      } else if (step.type === 'sentence_builder') {
        const btn = document.getElementById('btn-check-tiles');
        if (btn && btn.innerText.includes('Weiter')) nextRunnerStep();
        else checkSentenceTiles();
      } else if (step.type === 'celebration') {
        finishLessonAndGoNext();
      } else {
        nextRunnerStep();
      }
      return;
    }

    if (e.key === ' ') {
      e.preventDefault();
      if (step.type === 'vocab_intro') speakCurrentStepWord();
      else if (step.type === 'micro_drill') speakCurrentStepPrompt();
      else if (step.type === 'reading_comprehension') speakReadingText(1.0);
      return;
    }

    if ((step.type === 'micro_drill' || step.type === 'reading_comprehension') && !step.answered) {
      const handler = step.type === 'micro_drill' ? handleDrillAnswer : handleReadingAnswer;
      if (['1', '2', '3', '4'].includes(e.key)) {
        e.preventDefault();
        handler(parseInt(e.key) - 1);
      } else if (['a', 'b', 'c', 'd'].includes(e.key.toLowerCase())) {
        e.preventDefault();
        const map = { a: 0, b: 1, c: 2, d: 3 };
        handler(map[e.key.toLowerCase()]);
      }
    }
  }
});

/* Helpers to Extract Vocab and Build Recalls */
function extractVocabItems(lesson) {
  const items = [];
  (lesson.lectureContent || []).forEach(sec => {
    if (sec.type === 'vocabulary') {
      const rowMatches = sec.content.matchAll(/<tr>\s*<td>(<strong>)?([^<]+)(<\/strong>)?<\/td>\s*<td>([^<]+)<\/td>\s*<td>([^<]*)<\/td>/gi);
      for (const m of rowMatches) {
        items.push({
          de: m[2].trim(),
          en: m[4].trim(),
          ex: m[5].trim() || 'Ich mag das sehr.'
        });
      }
    }
  });
  return items;
}

function guessGender(deWord) {
  const lower = deWord.toLowerCase();
  if (lower.startsWith('der ') || lower.includes('(der)')) return 'der';
  if (lower.startsWith('die ') || lower.includes('(die)')) return 'die';
  if (lower.startsWith('das ') || lower.includes('(das)')) return 'das';
  return 'other';
}

function buildRecallOptions(correctItem, allItems) {
  const distractors = allItems
    .filter(it => it.en !== correctItem.en)
    .map(it => it.en);
  
  const fallbacks = ['to arrive on time', 'friendly and helpful', 'in the afternoon', 'because of the weather', 'to make a decision', 'together with friends'];
  while (distractors.length < 3) {
    distractors.push(fallbacks.pop());
  }

  const chosenDistractors = distractors.sort(() => Math.random() - 0.5).slice(0, 3);
  const options = [...chosenDistractors, correctItem.en].sort(() => Math.random() - 0.5);
  const correctIndex = options.indexOf(correctItem.en);

  return { options, correctIndex };
}

/* Theme Management (Pastel Tag & Pastel Nacht) */
function initTheme() {
  const saved = localStorage.getItem('deutschmeister_theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeButton(saved);
}

function toggleTheme() {
  soundEngine.click();
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('deutschmeister_theme', next);
  updateThemeButton(next);
}

function updateThemeButton(theme) {
  const btn = document.getElementById('btn-theme-toggle');
  if (btn) {
    btn.innerText = theme === 'light' ? '🌸 Pastel Tag' : '🌙 Pastel Nacht';
  }
}

initTheme();

showDashboard();
